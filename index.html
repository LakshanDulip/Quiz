<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LXN STEM · Quiz Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ----- CSS variables (light/dark) ----- */
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Work Sans', sans-serif;
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app { flex: 1; display: flex; flex-direction: column; }

    /* DARK theme (default) */
    :root {
      --bg: #111218;
      --bg2: #1a1d27;
      --card: #1e212c;
      --card-hover: #282d3a;
      --text: #eceef2;
      --textSoft: #9aa1b0;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 12px 32px rgba(0,0,0,0.7);
      --maths: #6ab0f7;
      --mathsLight: rgba(106, 176, 247, 0.18);
      --science: #5fc7b7;
      --scienceLight: rgba(95, 199, 183, 0.18);
      --stamp: #f27b7b;
      --stampLight: rgba(242, 123, 123, 0.2);
      --select: #ffd966;
      --selectLight: rgba(255, 217, 102, 0.18);
      --header: #0b0d12;
      --radius: 18px;
      --radiusSm: 12px;
      --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
    }
    /* LIGHT theme */
    [data-theme="light"] {
      --bg: #f5f7fc;
      --bg2: #eef1f8;
      --card: #ffffff;
      --card-hover: #f0f3fa;
      --text: #1a1e2c;
      --textSoft: #3d4457;
      --border: rgba(0,0,0,0.08);
      --shadow: 0 12px 30px rgba(0,0,0,0.08);
      --maths: #2b7fc7;
      --mathsLight: rgba(43, 127, 199, 0.12);
      --science: #1f9a8a;
      --scienceLight: rgba(31, 154, 138, 0.12);
      --stamp: #cc5555;
      --stampLight: rgba(204, 85, 85, 0.12);
      --select: #c9a53b;
      --selectLight: rgba(201, 165, 59, 0.12);
      --header: #dce0ec;
      --border: rgba(0,0,0,0.06);
    }

    body { background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }

    /* ----- loader animation (beautiful) ----- */
    .loader-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: 70vh; flex-direction: column; gap: 28px;
    }
    .loader-ring {
      width: 70px; height: 70px; border-radius: 50%;
      border: 4px solid var(--border);
      border-top-color: var(--stamp);
      animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      box-shadow: 0 0 0 0 rgba(242,123,123,0.2);
    }
    .loader-ring::after {
      content: ''; position: absolute; inset: 10px;
      border-radius: 50%; border: 3px solid var(--border);
      border-bottom-color: var(--maths);
      animation: spin 1.2s linear infinite reverse;
    }
    .loader-ring { position: relative; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-family: 'IBM Plex Mono', monospace; font-size: 14px;
      color: var(--textSoft); letter-spacing: 2px;
      animation: pulseText 1.4s ease-in-out infinite;
    }
    @keyframes pulseText { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

    /* ----- header & brand ----- */
    .site-header {
      background: var(--header); padding: 18px 20px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.3s;
      backdrop-filter: blur(2px);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto; display: flex;
      align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .brand {
      display: flex; align-items: center; gap: 14px; cursor: pointer;
    }
    .brand-logo {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--stampLight); border: 2px solid var(--stamp);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif; font-weight: 900; font-size: 20px;
      color: var(--stamp); transform: rotate(-6deg);
      transition: transform 0.2s;
    }
    .brand:hover .brand-logo { transform: rotate(0deg) scale(1.02); }
    .brand-text h1 {
      font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px;
      line-height: 1.2; letter-spacing: -0.2px;
    }
    .brand-text .sub {
      font-size: 12px; color: var(--textSoft); font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px; margin-top: 2px;
    }
    .header-actions {
      display: flex; align-items: center; gap: 12px;
    }
    .theme-toggle {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 30px; padding: 6px 14px; color: var(--text);
      font-size: 13px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: background 0.2s;
    }
    .theme-toggle:hover { background: var(--card-hover); }

    /* ----- main layout ----- */
    main {
      flex: 1; max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; width: 100%;
    }
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      text-transform: uppercase; letter-spacing: 2px; color: var(--textSoft);
      margin-bottom: 6px;
    }
    .page-title {
      font-family: 'Fraunces', serif; font-size: clamp(26px, 4vw, 38px);
      font-weight: 700; color: var(--text); margin: 0 0 6px;
    }
    .page-sub {
      color: var(--textSoft); font-size: 15px; margin-bottom: 28px;
    }
    .breadcrumb {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      color: var(--textSoft); margin-bottom: 20px;
    }
    .breadcrumb a { color: var(--maths); }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { margin: 0 6px; opacity: 0.5; }

    /* subject grid */
    .subject-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px;
    }
    .subject-tile {
      background: var(--card); border-radius: var(--radius);
      padding: 28px 22px 24px; border: 1px solid var(--border);
      box-shadow: var(--shadow); cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      position: relative; overflow: hidden;
    }
    .subject-tile:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
      background: var(--card-hover);
    }
    .subject-tile .icon-big {
      font-size: 44px; margin-bottom: 6px; display: flex; gap: 8px;
    }
    .subject-tile h3 {
      font-family: 'Fraunces', serif; font-size: 24px; color: var(--text);
      margin: 0 0 2px;
    }
    .subject-tile .sinhala {
      font-size: 14px; color: var(--textSoft); margin-bottom: 10px;
    }
    .subject-tile .tag {
      display: inline-block; padding: 4px 14px; border-radius: 30px;
      font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
      font-weight: 600; margin-top: 12px;
    }
    .subject-tile.maths .tag { background: var(--mathsLight); color: var(--maths); }
    .subject-tile.science .tag { background: var(--scienceLight); color: var(--science); }
    .subject-tile.maths { border-left: 6px solid var(--maths); }
    .subject-tile.science { border-left: 6px solid var(--science); }

    /* grade cards */
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px;
    }
    .grade-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radiusSm); padding: 22px 12px; text-align: center;
      cursor: pointer; box-shadow: var(--shadow); transition: transform 0.2s, background 0.2s;
    }
    .grade-card:hover { transform: translateY(-4px); background: var(--card-hover); }
    .grade-card .num {
      font-family: 'Fraunces', serif; font-size: 34px; font-weight: 700;
    }
    .grade-card.maths .num { color: var(--maths); }
    .grade-card.science .num { color: var(--science); }
    .grade-card .lbl {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--textSoft); font-family: 'IBM Plex Mono', monospace;
    }

    /* lesson list */
    .lesson-list { display: flex; flex-direction: column; gap: 14px; }
    .lesson-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radiusSm); padding: 16px 20px;
      display: flex; align-items: center; gap: 18px;
      cursor: pointer; transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow);
    }
    .lesson-card:hover {
      transform: translateY(-3px) scale(1.002);
      background: var(--card-hover);
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    }
    .lesson-card .icon-fallback {
      width: 64px; height: 64px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700;
      flex: none; color: #111;
    }
    .lesson-card .body { flex: 1; min-width: 0; }
    .lesson-card h4 { font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 4px; }
    .lesson-card p { font-size: 13px; color: var(--textSoft); margin: 0; }
    .qcount {
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      color: var(--textSoft); margin-top: 6px; display: inline-block;
    }

    /* lesson detail */
    .lesson-detail {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden;
    }
    .lesson-detail img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
    .lesson-detail .content { padding: 28px 30px; }
    .lesson-detail h2 { font-family: 'Fraunces', serif; font-size: 28px; margin: 0 0 10px; }
    .lesson-detail .desc { color: var(--textSoft); white-space: pre-wrap; margin-bottom: 20px; }

    /* buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 14px; padding: 10px 22px;
      border-radius: 40px; border: none; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      background: var(--text); color: var(--bg);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .btn:disabled { opacity: 0.4; pointer-events: none; transform: none; }
    .btn.stamp-btn { background: var(--stamp); color: #121212; }
    .btn.outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }

    /* quiz */
    .quiz-wrap {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px 26px;
      max-width: 680px; margin: 0 auto; box-shadow: var(--shadow);
    }
    .quiz-progress {
      display: flex; justify-content: space-between; font-size: 13px;
      color: var(--textSoft); font-family: 'IBM Plex Mono', monospace;
      margin-bottom: 12px;
    }
    .progress-bar {
      height: 6px; background: var(--bg2); border-radius: 10px;
      overflow: hidden; margin-bottom: 24px;
    }
    .progress-bar .fill {
      height: 100%; background: var(--stamp); border-radius: 10px;
      transition: width 0.25s ease;
    }
    .quiz-question h3 {
      font-family: 'Fraunces', serif; font-size: 22px; margin: 0 0 20px;
      line-height: 1.3;
    }
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
    .option-btn {
      text-align: left; padding: 14px 16px; border-radius: 12px;
      border: 1.5px solid var(--border); background: var(--bg2);
      cursor: pointer; font-size: 14px; display: flex; gap: 12px;
      align-items: center; transition: border 0.15s, background 0.15s;
      color: var(--text);
    }
    .option-btn:hover { border-color: var(--textSoft); background: var(--card-hover); }
    .option-btn.selected {
      border-color: var(--select); background: var(--selectLight);
      font-weight: 600;
    }
    .option-btn .letter {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1.5px solid var(--border); display: flex;
      align-items: center; justify-content: center;
      font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    }
    .option-btn.selected .letter { border-color: var(--select); color: var(--select); }
    .quiz-nav { display: flex; justify-content: space-between; gap: 10px; }

    .stamp-seal {
      width: 150px; height: 150px; border-radius: 50%;
      border: 4px double var(--stamp); margin: 0 auto 20px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; transform: rotate(-4deg);
      color: var(--stamp); font-family: 'IBM Plex Mono', monospace;
    }
    .stamp-seal .pct { font-size: 38px; font-weight: 700; line-height: 1; }
    .stamp-seal .lbl { font-size: 10px; letter-spacing: 2px; margin-top: 4px; }
    .review-item {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 12px; background: var(--bg2);
    }
    .review-item.correct { border-left: 4px solid var(--science); }
    .review-item.incorrect { border-left: 4px solid var(--stamp); }
    .review-item .q { font-weight: 600; margin-bottom: 4px; }

    .empty-state {
      text-align: center; padding: 50px 20px; color: var(--textSoft);
      border: 1.5px dashed var(--border); border-radius: var(--radius);
    }
    .error-message { text-align: center; padding: 40px; color: var(--stamp); background: var(--card); border-radius: var(--radius); }

    .footer {
      text-align: center; padding: 22px 20px; font-size: 12px;
      color: var(--textSoft); border-top: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace; background: var(--header);
    }

    /* preview animation (last mark) */
    .preview-badge {
      display: inline-block; background: var(--stampLight);
      padding: 4px 16px; border-radius: 60px; font-size: 11px;
      color: var(--stamp); font-weight: 600; letter-spacing: 0.5px;
      animation: glowPulse 2s infinite;
    }
    @keyframes glowPulse {
      0% { box-shadow: 0 0 0 0 rgba(242,123,123,0.3); }
      50% { box-shadow: 0 0 18px 6px rgba(242,123,123,0.1); }
      100% { box-shadow: 0 0 0 0 rgba(242,123,123,0); }
    }

    @media (max-width: 600px) {
      .header-inner { flex-direction: column; align-items: stretch; gap: 8px; }
      .brand-text h1 { font-size: 19px; }
      .lesson-card { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script>
  // ---------- DATA ----------
  const SUBJECTS = {
    maths:   { key:'maths',   name:'Mathematics', sinhala:'ගණිතය', emoji:'📐', desc:'Numbers, algebra, geometry and problem solving.' },
    science: { key:'science', name:'Science',     sinhala:'විද්‍යාව', emoji:'🔬', desc:'Life, matter, energy and the natural world.' }
  };
  const GRADES = ['6','7','8','9','10','11'];

  let appState = {
    content: null,
    loading: true,
    error: null,
    route: { name:'home' },
    quiz: null,
    theme: 'dark'
  };

  // load theme from localStorage
  (function initTheme(){
    const stored = localStorage.getItem('lxn-theme');
    if (stored === 'light') appState.theme = 'light';
    document.documentElement.setAttribute('data-theme', appState.theme);
  })();

  function toggleTheme(){
    const next = appState.theme === 'dark' ? 'light' : 'dark';
    appState.theme = next;
    localStorage.setItem('lxn-theme', next);
    document.documentElement.setAttribute('data-theme', next);
  }

  // helpers
  function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }
  function shuffleIdx(n){ const a=Array.from({length:n},(_,i)=>i); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
  function subjectMeta(k){ return SUBJECTS[k] || SUBJECTS.maths; }
  function getLessons(subject, grade){ try { return appState.content?.subjects?.[subject]?.grades?.[grade]?.lessons || []; } catch(e){ return []; } }
  function findLesson(subject, grade, id){ return getLessons(subject, grade).find(l => l.id === id) || null; }

  // fetch data
  async function loadData(){
    try {
      const res = await fetch('data.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      appState.content = data;
      appState.loading = false;
      render();
    } catch(e){
      appState.error = '⚠️ දත්ත ගොනුව හමු නොවීය. data.json පරීක්ෂා කරන්න.';
      appState.loading = false;
      render();
    }
  }

  // routing
  function parseHash(){
    const h = location.hash.replace(/^#\/?/,'');
    const parts = h.split('/').filter(Boolean);
    if(parts[0]==='subject' && parts[1] && parts[2]==='grade' && parts[3]){
      if(parts[4]==='lesson' && parts[5]) return { name:'lessonDetail', subject:parts[1], grade:parts[3], lessonId:parts[5] };
      if(parts[4]==='quiz' && parts[5]) return { name:'quiz', subject:parts[1], grade:parts[3], lessonId:parts[5] };
      return { name:'lessons', subject:parts[1], grade:parts[3] };
    }
    if(parts[0]==='subject' && parts[1]) return { name:'grades', subject:parts[1] };
    return { name:'home' };
  }
  function navigate(hash){ location.hash = hash; }

  // render
  function render(){
    const app = document.getElementById('app');
    if(appState.loading){
      app.innerHTML = `
        <header class="site-header"><div class="header-inner"><div class="brand"><div class="brand-logo">LQH</div><div class="brand-text"><h1>LXN STEM</h1><div class="sub">Learn • Think • Achieve</div></div></div></div></header>
        <main><div class="loader-wrap"><div class="loader-ring"></div><div class="loader-text">loading lessons ...</div></div></main>
        <div class="footer">LXN STEM Academy · built by Lakshan Dulip</div>
      `;
      return;
    }
    if(appState.error){
      app.innerHTML = `
        <header class="site-header"><div class="header-inner">...</div></header>
        <main><div class="error-message">${appState.error}</div></main>
        <div class="footer">LXN STEM · Lakshan Dulip</div>
      `;
      return;
    }
    const r = appState.route;
    let body = '';
    if(r.name==='home') body = renderHome();
    else if(r.name==='grades') body = renderGrades(r.subject);
    else if(r.name==='lessons') body = renderLessons(r.subject, r.grade);
    else if(r.name==='lessonDetail') body = renderLessonDetail(r.subject, r.grade, r.lessonId);
    else if(r.name==='quiz') body = renderQuizScreen(r.subject, r.grade, r.lessonId);
    else body = renderHome();

    app.innerHTML = renderShell(body);
    window.scrollTo(0,0);
  }

  function renderShell(bodyHtml){
    return `
      <header class="site-header">
        <div class="header-inner">
          <div class="brand" data-nav="#/">
            <div class="brand-logo">LQH</div>
            <div class="brand-text">
              <h1>LXN STEM</h1>
              <div class="sub">Learn • Think • Achieve</div>
            </div>
          </div>
          <div class="header-actions">
            <span class="preview-badge">⚡ quiz ready</span>
            <button class="theme-toggle" data-action="toggle-theme">
              ${appState.theme==='dark' ? '☀️ Light' : '🌙 Dark'}
            </button>
          </div>
        </div>
      </header>
      <main>${bodyHtml}</main>
      <div class="footer">LXN STEM Academy · developed by Lakshan Dulip</div>
    `;
  }

  // home
  function renderHome(){
    return `
      <p class="eyebrow">📘 choose your journey</p>
      <h2 class="page-title">What are we studying today?</h2>
      <p class="page-sub">Select a subject, then a grade, then dive into lessons and quizzes.</p>
      <div class="subject-grid">
        ${Object.values(SUBJECTS).map(s => `
          <div class="subject-tile ${s.key}" data-nav="#/subject/${s.key}">
            <div class="icon-big">${s.emoji}</div>
            <h3>${escapeHtml(s.name)}</h3>
            <p class="sinhala">${escapeHtml(s.sinhala)}</p>
            <p class="desc" style="color:var(--textSoft);font-size:13px;">${escapeHtml(s.desc)}</p>
            <span class="tag">Grades 6–11</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // grades
  function renderGrades(subject){
    const meta = subjectMeta(subject);
    return `
      <p class="breadcrumb"><a data-nav="#/">Home</a><span class="sep">/</span>${escapeHtml(meta.name)}</p>
      <p class="eyebrow">${escapeHtml(meta.name)}</p>
      <h2 class="page-title">Choose your grade</h2>
      <p class="page-sub">${escapeHtml(meta.desc)}</p>
      <div class="card-grid">
        ${GRADES.map(g => `
          <div class="grade-card ${meta.key}" data-nav="#/subject/${meta.key}/grade/${g}">
            <div class="num">${g}</div>
            <div class="lbl">Grade</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // lessons
  function renderLessons(subject, grade){
    const meta = subjectMeta(subject);
    const lessons = getLessons(subject, grade);
    return `
      <p class="breadcrumb"><a data-nav="#/">Home</a><span class="sep">/</span><a data-nav="#/subject/${meta.key}">${escapeHtml(meta.name)}</a><span class="sep">/</span>Grade ${escapeHtml(grade)}</p>
      <p class="eyebrow">${escapeHtml(meta.name)} · Grade ${escapeHtml(grade)}</p>
      <h2 class="page-title">Lessons</h2>
      <p class="page-sub">Pick a lesson, read, then take the quiz.</p>
      ${lessons.length===0 ? `<div class="empty-state"><div class="big">📭 No lessons yet</div><p>New ${escapeHtml(meta.name)} lessons coming soon.</p></div>` : `
        <div class="lesson-list">
          ${lessons.map(l => `
            <div class="lesson-card" data-nav="#/subject/${meta.key}/grade/${grade}/lesson/${l.id}">
              <div class="icon-fallback" style="background:${meta.key==='maths'?'var(--maths)':'var(--science)'}">${meta.emoji}</div>
              <div class="body">
                <h4>${escapeHtml(l.title)}</h4>
                <p>${escapeHtml(l.description||'')}</p>
                <span class="qcount">${l.questions.length} Q</span>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    `;
  }

  // lesson detail
  function renderLessonDetail(subject, grade, lessonId){
    const meta = subjectMeta(subject);
    const lesson = findLesson(subject, grade, lessonId);
    if(!lesson) return `<div class="empty-state"><div class="big">Lesson not found</div><a data-nav="#/subject/${meta.key}/grade/${grade}">↩ back</a></div>`;
    const hasQuiz = lesson.questions && lesson.questions.length > 0;
    return `
      <p class="breadcrumb"><a data-nav="#/">Home</a><span class="sep">/</span><a data-nav="#/subject/${meta.key}">${escapeHtml(meta.name)}</a><span class="sep">/</span><a data-nav="#/subject/${meta.key}/grade/${grade}">Grade ${escapeHtml(grade)}</a><span class="sep">/</span>${escapeHtml(lesson.title)}</p>
      <div class="lesson-detail">
        ${lesson.image ? `<img src="${escapeHtml(lesson.image)}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="content">
          <h2>${escapeHtml(lesson.title)}</h2>
          <p class="desc">${nl2br(lesson.description||'')}</p>
          <div class="actions" style="display:flex;gap:12px;flex-wrap:wrap;">
            ${hasQuiz ? `<button class="btn stamp-btn" data-nav="#/subject/${meta.key}/grade/${grade}/quiz/${lesson.id}">🚀 Start quiz (${lesson.questions.length})</button>` : `<button class="btn" disabled>Quiz coming</button>`}
            <button class="btn outline" data-nav="#/subject/${meta.key}/grade/${grade}">Back</button>
            ${lesson.link ? `<a class="ext-link" href="${escapeHtml(lesson.link)}" target="_blank" style="color:var(--maths);">🔗 more</a>` : ''}
          </div>
        </div>
      </div>
    `;
  }

  // quiz
  function initQuizIfNeeded(subject, grade, lessonId){
    const q = appState.quiz;
    if(q && q.subject===subject && q.grade===grade && q.lessonId===lessonId) return;
    const lesson = findLesson(subject, grade, lessonId);
    if(!lesson) { appState.quiz = null; return; }
    appState.quiz = {
      subject, grade, lessonId,
      order: shuffleIdx(lesson.questions.length),
      idx: 0,
      answers: {},
      submitted: false
    };
  }

  function renderQuizScreen(subject, grade, lessonId){
    const meta = subjectMeta(subject);
    const lesson = findLesson(subject, grade, lessonId);
    if(!lesson || !lesson.questions || lesson.questions.length===0) return `<div class="empty-state"><div class="big">No quiz</div><a data-nav="#/subject/${meta.key}/grade/${grade}/lesson/${lessonId}">↩ back</a></div>`;
    initQuizIfNeeded(subject, grade, lessonId);
    const quiz = appState.quiz;
    const total = quiz.order.length;

    if(quiz.submitted){
      let correct=0;
      const rows = quiz.order.map((qi,i)=>{
        const q = lesson.questions[qi];
        const user = quiz.answers[i];
        const ok = user === q.correct;
        if(ok) correct++;
        return `
          <div class="review-item ${ok?'correct':'incorrect'}">
            <div class="q">${i+1}. ${escapeHtml(q.q)}</div>
            <div style="font-size:13px;color:var(--textSoft);">Your answer: ${user==null?'<em>skipped</em>':escapeHtml(q.options[user])}</div>
            ${!ok ? `<div style="font-size:13px;color:var(--science);">Correct: ${escapeHtml(q.options[q.correct])}</div>` : ''}
            ${q.explanation ? `<div style="font-size:12px;color:var(--textSoft);margin-top:4px;">💡 ${escapeHtml(q.explanation)}</div>` : ''}
          </div>
        `;
      }).join('');
      const pct = Math.round((correct/total)*100);
      return `
        <div class="quiz-wrap result-wrap" style="text-align:center;">
          <div class="stamp-seal"><div class="pct">${pct}%</div><div class="lbl">SCORE</div></div>
          <p style="color:var(--textSoft);margin-bottom:20px;">${correct} of ${total} correct · ${escapeHtml(lesson.title)}</p>
          <div style="text-align:left;max-height:400px;overflow-y:auto;margin-bottom:20px;">${rows}</div>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
            <button class="btn stamp-btn" data-action="retake-quiz">🔄 Retake</button>
            <button class="btn outline" data-nav="#/subject/${meta.key}/grade/${grade}/lesson/${lessonId}">📖 lesson</button>
          </div>
        </div>
      `;
    }

    const qIndex = quiz.order[quiz.idx];
    const question = lesson.questions[qIndex];
    const selected = quiz.answers[quiz.idx];
    const letters = ['A','B','C','D','E','F'];
    return `
      <div class="quiz-wrap">
        <div class="quiz-progress">
          <span>${escapeHtml(lesson.title)}</span>
          <span>${quiz.idx+1} / ${total}</span>
        </div>
        <div class="progress-bar"><div class="fill" style="width:${(quiz.idx/total)*100}%"></div></div>
        <div class="quiz-question">
          ${question.image ? `<img src="${escapeHtml(question.image)}" alt="" style="max-height:180px;width:100%;object-fit:cover;border-radius:12px;margin-bottom:14px;">` : ''}
          <h3>${escapeHtml(question.q)}</h3>
          <div class="options">
            ${question.options.map((opt,i)=>`
              <button type="button" class="option-btn ${selected===i?'selected':''}" data-action="select-answer" data-value="${i}">
                <span class="letter">${letters[i]||i+1}</span> ${escapeHtml(opt)}
              </button>
            `).join('')}
          </div>
        </div>
        <div class="quiz-nav">
          <button class="btn outline" data-action="prev-question" ${quiz.idx===0?'disabled':''}>◀ Prev</button>
          <button class="btn stamp-btn" data-action="next-question" ${selected==null?'disabled':''}>${quiz.idx===total-1?'Finish ✅':'Next ▶'}</button>
        </div>
      </div>
    `;
  }

  // ---------- event delegation ----------
  document.addEventListener('click', function(e){
    const nav = e.target.closest('[data-nav]');
    if(nav){ navigate(nav.getAttribute('data-nav')); return; }

    const act = e.target.closest('[data-action]');
    if(!act) return;
    const action = act.getAttribute('data-action');

    if(action === 'toggle-theme'){ toggleTheme(); render(); return; }

    if(action === 'select-answer'){
      if(appState.quiz){
        appState.quiz.answers[appState.quiz.idx] = parseInt(act.getAttribute('data-value'),10);
        render();
      }
      return;
    }
    if(action === 'next-question'){
      const q = appState.quiz;
      if(!q) return;
      if(q.idx < q.order.length-1) q.idx++;
      else q.submitted = true;
      render();
      return;
    }
    if(action === 'prev-question'){
      if(appState.quiz && appState.quiz.idx > 0){ appState.quiz.idx--; render(); }
      return;
    }
    if(action === 'retake-quiz'){
      const r = appState.route;
      appState.quiz = null;
      initQuizIfNeeded(r.subject, r.grade, r.lessonId);
      render();
      return;
    }
  });

  window.addEventListener('hashchange', ()=>{ appState.route = parseHash(); render(); });

  // start
  loadData();
</script>
</body>
</html>
