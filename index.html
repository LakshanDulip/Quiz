<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Quiz Hub — Maths & Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS (DARK THEME) ============ */
  :root{
    --paper: #121212;           /* Main background */
    --paper-2: #242424;         /* Secondary background */
    --card: #1e1e1e;            /* Card background */
    --ink: #e0e0e0;             /* Primary text */
    --ink-soft: #9e9e9e;        /* Secondary text */
    --maths: #64b5f6;           /* Maths color (Light Blue) */
    --maths-light: rgba(100, 181, 246, 0.15);
    --science: #4db6ac;         /* Science color (Teal) */
    --science-light: rgba(77, 182, 172, 0.15);
    --stamp: #e57373;           /* Accent color (Light Red) */
    --stamp-light: rgba(229, 115, 115, 0.15);
    --select: #ffd54f;          /* Selection Yellow */
    --select-light: rgba(255, 213, 79, 0.15);
    --line: rgba(255, 255, 255, 0.12); /* Borders */
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
    --shadow-sm: 0 3px 10px rgba(0, 0, 0, 0.4);
    --radius: 14px;
    --radius-lg: 22px;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Work Sans', -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--select); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  /* ============ HEADER ============ */
  .site-header{
    background: #000000;
    color: var(--ink);
    padding:22px 20px 26px;
    position:relative;
    background-image: repeating-linear-gradient(to bottom, transparent 0 26px, rgba(255,255,255,0.05) 26px 27px);
  }
  .site-header .inner{max-width:1000px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:14px; cursor:pointer;}
  .brand .stamp-mini{
    width:46px;height:46px;border-radius:50%;border:2.5px solid var(--stamp);
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg); flex:none;
    color:var(--stamp); font-family:var(--font-mono); font-weight:600; font-size:11px;
    background:var(--stamp-light);
  }
  .brand-text h1{font-family:var(--font-display); font-weight:700; font-size:22px; margin:0; letter-spacing:0.2px;}
  .brand-text p{margin:2px 0 0; font-size:12.5px; color:rgba(255,255,255,0.5); font-family:var(--font-mono);}
  .header-links{display:flex; gap:10px; align-items:center; font-size:13px;}
  .header-links a{
    color:rgba(255,255,255,0.6); background:none; border:none; cursor:pointer; font-size:13px;
    text-decoration:none; padding:6px 4px; transition: color 0.2s ease;
  }
  .header-links a:hover{color:#fff;}

  main{flex:1; max-width:1000px; margin:0 auto; padding:34px 20px 60px; width:100%;}

  .eyebrow{
    font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--ink-soft); margin:0 0 8px;
  }
  h2.page-title{font-family:var(--font-display); font-size:clamp(24px,4vw,34px); margin:0 0 6px; font-weight:700; color:#fff;}
  .page-sub{color:var(--ink-soft); margin:0 0 28px; font-size:15px;}

  .breadcrumb{font-size:13px; color:var(--ink-soft); margin-bottom:20px; font-family:var(--font-mono);}
  .breadcrumb a{text-decoration:none; color:var(--maths);}
  .breadcrumb a:hover{text-decoration:underline;}
  .breadcrumb .sep{margin:0 6px; opacity:0.5;}

  /* ============ SUBJECT TILES ============ */
  .subject-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:600px){.subject-grid{grid-template-columns:1fr;}}
  .subject-tile{
    position:relative; background:var(--card); border-radius:var(--radius-lg);
    padding:30px 26px 26px 40px; box-shadow:var(--shadow); cursor:pointer;
    border:1px solid var(--line); overflow:hidden;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .subject-tile:hover{transform:translateY(-3px) rotate(-0.4deg); box-shadow:0 14px 30px rgba(0,0,0,0.8);}
  .subject-tile::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:14px;
    background-image: radial-gradient(circle, rgba(255,255,255,0.08) 2.5px, transparent 2.6px);
    background-size:14px 20px; background-position:center;
  }
  .subject-tile.maths{border-top:5px solid var(--maths);}
  .subject-tile.science{border-top:5px solid var(--science);}
  .subject-tile h3{font-family:var(--font-display); font-size:26px; margin:0 0 4px; color:#fff;}
  .subject-tile .sinhala{font-size:14px; color:var(--ink-soft); margin:0 0 14px;}
  .subject-tile .desc{font-size:13.5px; color:var(--ink-soft); margin:0;}
  .subject-tile .tag{
    display:inline-block; margin-top:16px; font-family:var(--font-mono); font-size:11.5px;
    padding:4px 10px; border-radius:20px; font-weight:600;
  }
  .subject-tile.maths .tag{background:var(--maths-light); color:var(--maths);}
  .subject-tile.science .tag{background:var(--science-light); color:var(--science);}

  /* ============ GRID CARDS (grades / lessons) ============ */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px;}
  .grade-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 18px; text-align:center; cursor:pointer; box-shadow:var(--shadow-sm);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .grade-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .grade-card .num{font-family:var(--font-display); font-size:30px; font-weight:700;}
  .grade-card .lbl{font-size:12px; color:var(--ink-soft); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:1px; margin-top:2px;}
  .grade-card.maths .num{color:var(--maths);}
  .grade-card.science .num{color:var(--science);}

  .lesson-list{display:flex; flex-direction:column; gap:14px;}
  .lesson-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; display:flex; gap:16px; align-items:center; cursor:pointer; box-shadow:var(--shadow-sm);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .lesson-card:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .lesson-card img{width:64px; height:64px; object-fit:cover; border-radius:10px; flex:none; border:1px solid var(--line);}
  .lesson-card .icon-fallback{
    width:64px;height:64px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display); font-size:22px; font-weight:700; color:#121212;
  }
  .lesson-card .body{flex:1; min-width:0;}
  .lesson-card h4{margin:0 0 4px; font-family:var(--font-display); font-size:18px; color:#fff;}
  .lesson-card p{margin:0; font-size:13.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .qcount{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); margin-top:8px; display:inline-block;}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft); border:1.5px dashed var(--line); border-radius:var(--radius-lg);
  }
  .empty-state .big{font-family:var(--font-display); font-size:20px; color:var(--ink); margin-bottom:6px;}

  /* ============ BUTTONS ============ */
  .btn{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--font-body); font-weight:600; font-size:14px;
    padding:11px 20px; border-radius:30px; border:none; cursor:pointer; text-decoration:none;
    transition: transform .1s ease, box-shadow .1s ease; background:var(--ink); color:#121212;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 6px 14px rgba(0,0,0,0.8);}
  .btn:disabled{opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none;}
  .btn.stamp-btn{background:var(--stamp); color:#121212;}
  .btn.outline{background:transparent; color:var(--ink); border:1.5px solid var(--line);}

  /* ============ LESSON DETAIL ============ */
  .lesson-detail{background:var(--card); border-radius:var(--radius-lg); border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden;}
  .lesson-detail img{width:100%; max-height:280px; object-fit:cover; display:block;}
  .lesson-detail .content{padding:28px 30px;}
  .lesson-detail h2{font-family:var(--font-display); margin:0 0 10px; font-size:28px; color:#fff;}
  .lesson-detail .desc{color:var(--ink-soft); white-space:pre-wrap; margin-bottom:20px;}
  .lesson-detail .actions{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .ext-link{font-size:13.5px; color:var(--maths); text-decoration:none; font-family:var(--font-mono);}
  .ext-link:hover{text-decoration:underline;}

  /* ============ QUIZ ============ */
  .quiz-wrap{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:30px; max-width:640px; margin:0 auto;}
  .quiz-progress{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .quiz-progress .count{font-family:var(--font-mono); font-size:13px; color:var(--ink-soft);}
  .progress-bar{height:6px; background:var(--paper-2); border-radius:6px; overflow:hidden; margin-bottom:26px;}
  .progress-bar .fill{height:100%; background:var(--stamp); border-radius:6px; transition:width .25s ease;}
  .quiz-question img{width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:16px;}
  .quiz-question h3{font-family:var(--font-display); font-size:22px; margin:0 0 22px; line-height:1.35; color:#fff;}
  .options{display:flex; flex-direction:column; gap:10px; margin-bottom:26px;}
  .option-btn{
    text-align:left; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--paper);
    cursor:pointer; font-size:14.5px; font-family:var(--font-body); display:flex; align-items:center; gap:12px;
    transition: border-color .12s ease, background .12s ease; color:var(--ink);
  }
  .option-btn:hover{border-color:var(--ink-soft); background:var(--card);}
  .option-btn.selected{border-color:var(--select); background:var(--select-light); font-weight:600;}
  .option-btn .letter{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); flex:none;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px;
  }
  .option-btn.selected .letter{border-color:var(--select); color:var(--select);}
  .quiz-nav{display:flex; justify-content:space-between; gap:10px;}

  .result-wrap{text-align:center;}
  .stamp-seal{
    width:150px; height:150px; border-radius:50%; margin:6px auto 20px; position:relative;
    border:4px double var(--stamp); display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-6deg); color:var(--stamp); font-family:var(--font-mono);
  }
  .stamp-seal .pct{font-size:34px; font-weight:700; line-height:1;}
  .stamp-seal .lbl{font-size:10px; letter-spacing:2px; margin-top:4px;}
  .result-summary{font-size:15px; color:var(--ink-soft); margin-bottom:26px;}
  .review-list{text-align:left; display:flex; flex-direction:column; gap:14px; margin-bottom:26px;}
  .review-item{border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--paper);}
  .review-item.correct{border-left:4px solid var(--science);}
  .review-item.incorrect{border-left:4px solid var(--stamp);}
  .review-item .q{font-weight:600; margin-bottom:8px; font-size:14.5px; color:#fff;}
  .review-item .a-line{font-size:13.5px; margin:3px 0; color:var(--ink-soft);}
  .review-item .a-line.wrong-answer{color:var(--stamp);}
  .review-item .a-line.right-answer{color:var(--science);}
  .review-item .explain{font-size:12.5px; color:var(--ink-soft); margin-top:8px; font-style:italic;}
  .result-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

  .loading-screen{display:flex; align-items:center; justify-content:center; min-height:70vh; color:var(--ink-soft); font-family:var(--font-mono); font-size:13px;}
  .site-footer{text-align:center; padding:26px 20px; font-size:12px; color:var(--ink-soft); font-family:var(--font-mono);}
  .error-message { text-align: center; padding: 50px 20px; color: var(--stamp); font-weight: bold; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); max-width:600px; margin:40px auto;}
</style>
</head>
<body>
<div id="app"></div>

<script>
  /* =====================================================================
     LEARNING QUIZ HUB
     Single-file site pulling data from data.json (Dark Theme Adapted)
     ===================================================================== */

  const SUBJECTS = {
    maths:   { key:'maths',   name:'Mathematics', sinhala:'ගණිතය', desc:'Numbers, algebra, geometry and problem solving.' },
    science: { key:'science', name:'Science',     sinhala:'විද්‍යාව', desc:'Life, matter, energy and the natural world.' }
  };
  const GRADES = ['6','7','8','9','10','11'];

  /* ---------------- state ---------------- */
  let appState = {
    content: null,
    loading: true,
    error: null,
    route: {name:'home'},
    quiz: null
  };

  /* ---------------- helpers ---------------- */
  function escapeHtml(str){
    return (str==null?'':String(str)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function nl2br(str){ return escapeHtml(str).replace(/\n/g,'<br>'); }
  function shuffleIdx(n){
    const arr = Array.from({length:n}, (_,i)=>i);
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }
  function subjectMeta(key){ return SUBJECTS[key] || SUBJECTS.maths; }
  
  function getLessons(subject, grade){
    try { 
      // check if subjects and grade exist in JSON
      if(appState.content && appState.content.subjects && appState.content.subjects[subject] && appState.content.subjects[subject].grades && appState.content.subjects[subject].grades[grade]) {
          return appState.content.subjects[subject].grades[grade].lessons || [];
      }
      return [];
    }
    catch(e){ return []; }
  }
  
  function findLesson(subject, grade, lessonId){
    return getLessons(subject, grade).find(l => l.id === lessonId) || null;
  }

  /* ---------------- Fetch Data ---------------- */
  async function loadData() {
      try {
          const response = await fetch('data.json');
          if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          appState.content = data;
          appState.loading = false;
          render();
      } catch (error) {
          console.error("Error loading data:", error);
          appState.error = "දත්ත ලබාගැනීමේ දෝෂයකි. කරුණාකර data.json ගොනුව පරීක්ෂා කරන්න.";
          appState.loading = false;
          render();
      }
  }

  /* ---------------- router ---------------- */
  function parseHash(){
    const h = location.hash.replace(/^#\/?/, '');
    const parts = h.split('/').filter(Boolean);
    if(parts[0] === 'subject' && parts[1] && parts[2] === 'grade' && parts[3]){
      if(parts[4] === 'lesson' && parts[5]) return { name:'lessonDetail', subject:parts[1], grade:parts[3], lessonId:parts[5] };
      if(parts[4] === 'quiz' && parts[5]) return { name:'quiz', subject:parts[1], grade:parts[3], lessonId:parts[5] };
      return { name:'lessons', subject:parts[1], grade:parts[3] };
    }
    if(parts[0] === 'subject' && parts[1]) return { name:'grades', subject:parts[1] };
    return { name:'home' };
  }
  function navigate(hash){ location.hash = hash; }

  /* ---------------- render dispatch ---------------- */
  function render(){
    const app = document.getElementById('app');
    
    if(appState.loading){
      app.innerHTML = renderShell(`<div class="loading-screen">Loading...</div>`);
      return;
    }

    if (appState.error) {
         app.innerHTML = renderShell(`<div class="error-message">${appState.error}</div>`);
         return;
    }

    const r = appState.route;
    let body = '';
    if(r.name === 'home') body = renderHome();
    else if(r.name === 'grades') body = renderGrades(r.subject);
    else if(r.name === 'lessons') body = renderLessons(r.subject, r.grade);
    else if(r.name === 'lessonDetail') body = renderLessonDetail(r.subject, r.grade, r.lessonId);
    else if(r.name === 'quiz') body = renderQuizScreen(r.subject, r.grade, r.lessonId);
    else body = renderHome();

    app.innerHTML = renderShell(body);
    window.scrollTo(0,0);
  }

  function renderShell(bodyHtml){
    return `
      <header class="site-header">
        <div class="inner">
          <div class="brand" data-nav="#/">
            <div class="stamp-mini">LQH</div>
            <div class="brand-text">
              <h1>Learning Quiz Hub</h1>
              <p>Maths &amp; Science · Grades 6–11</p>
            </div>
          </div>
          <div class="header-links">
            <a href="#/" data-nav="#/">Home</a>
          </div>
        </div>
      </header>
      <main>${bodyHtml}</main>
      <footer class="site-footer">
        Learning Quiz Hub &middot; built for revision, one lesson at a time.
      </footer>
    `;
  }

  /* ---------------- HOME ---------------- */
  function renderHome(){
    return `
      <p class="eyebrow">Pick a subject</p>
      <h2 class="page-title">What are we studying today?</h2>
      <p class="page-sub">Choose a subject, then a grade, then a lesson — quizzes are waiting at the end of each one.</p>
      <div class="subject-grid">
        ${Object.values(SUBJECTS).map(s => `
          <div class="subject-tile ${s.key}" data-nav="#/subject/${s.key}">
            <h3>${escapeHtml(s.name)}</h3>
            <p class="sinhala">${escapeHtml(s.sinhala)}</p>
            <p class="desc">${escapeHtml(s.desc)}</p>
            <span class="tag">Grades 6 – 11</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  /* ---------------- GRADES ---------------- */
  function renderGrades(subject){
    const meta = subjectMeta(subject);
    return `
      <p class="breadcrumb"><a data-nav="#/">Home</a><span class="sep">/</span>${escapeHtml(meta.name)}</p>
      <p class="eyebrow">${escapeHtml(meta.name)}</p>
      <h2 class="page-title">Choose your grade</h2>
      <p class="page-sub">${escapeHtml(meta.desc)}</p>
      <div class="card-grid">
        ${GRADES.map(g => `
          <div class="grade-card ${meta.key}" data-nav="#/subject/${meta.key}/grade/${g}">
            <div class="num">${g}</div>
            <div class="lbl">Grade</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  /* ---------------- LESSONS ---------------- */
  function renderLessons(subject, grade){
    const meta = subjectMeta(subject);
    const lessons = getLessons(subject, grade);
    return `
      <p class="breadcrumb"><a data-nav="#/">Home</a><span class="sep">/</span><a data-nav="#/subject/${meta.key}">${escapeHtml(meta.name)}</a><span class="sep">/</span>Grade ${escapeHtml(grade)}</p>
      <p class="eyebrow">${escapeHtml(meta.name)} · Grade ${escapeHtml(grade)}</p>
      <h2 class="page-title">Lessons</h2>
      <p class="page-sub">Pick a lesson to read through, then take its quiz.</p>
      ${lessons.length === 0 ? `
        <div class="empty-state">
          <div class="big">No lessons here yet</div>
          <p>Check back soon — new ${escapeHtml(meta.name.toLowerCase())} lessons for Grade ${escapeHtml(grade)} are on the way.</p>
        </div>
      ` : `
        <div class="lesson-list">
          ${lessons.map(l => `
            <div class="lesson-card" data-nav="#/subject/${meta.key}/grade/${grade}/lesson/${l.id}">
              ${l.image ? `<img src="${escapeHtml(l.image)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'icon-fallback',style:'background:${meta.key==='maths'?'var(--maths)':'var(--science)'}',textContent:'${escapeHtml(meta.name[0])}'}))">`
                         : `<div class="icon-fallback" style="background:${meta.key==='maths' ? 'var(--maths)' : 'var(--science)'}">${escapeHtml(meta.name[0])}</div>`}
              <div class="body">
                <h4>${escapeHtml(l.title)}</h4>
                <p>${escapeHtml(l.description||'')}</p>
                <span class="qcount">${l.questions.length} question${l.questions.length===1?'':'s'}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    `;
  }

  /* ---------------- LESSON DETAIL ---------------- */
  function renderLessonDetail(subject, grade, lessonId){
    const meta = subjectMeta(subject);
    const lesson = findLesson(subject, grade, lessonId);
    if(!lesson){
      return `<div class="empty-state"><div class="big">Lesson not found</div><p><a data-nav="#/subject/${meta.key}/grade/${grade}">Back to lessons</a></p></div>`;
    }
    const hasQuiz = lesson.questions && lesson.questions.length > 0;
    return `
      <p class="breadcrumb"><a data-nav="#/">Home</a><span class="sep">/</span><a data-nav="#/subject/${meta.key}">${escapeHtml(meta.name)}</a><span class="sep">/</span><a data-nav="#/subject/${meta.key}/grade/${grade}">Grade ${escapeHtml(grade)}</a><span class="sep">/</span>${escapeHtml(lesson.title)}</p>
      <div class="lesson-detail">
        ${lesson.image ? `<img src="${escapeHtml(lesson.image)}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="content">
          <h2>${escapeHtml(lesson.title)}</h2>
          <p class="desc">${nl2br(lesson.description||'')}</p>
          <div class="actions">
            ${hasQuiz
              ? `<button class="btn stamp-btn" data-nav="#/subject/${meta.key}/grade/${grade}/quiz/${lesson.id}">Start quiz (${lesson.questions.length} Q)</button>`
              : `<button class="btn" disabled>Quiz coming soon</button>`}
            <button class="btn outline" data-nav="#/subject/${meta.key}/grade/${grade}">Back to lessons</button>
            ${lesson.link ? `<a class="ext-link" href="${escapeHtml(lesson.link)}" target="_blank" rel="noopener noreferrer">Related link ↗</a>` : ''}
          </div>
        </div>
      </div>
    `;
  }

  /* ---------------- QUIZ ---------------- */
  function initQuizIfNeeded(subject, grade, lessonId){
    const q = appState.quiz;
    if(q && q.subject===subject && q.grade===grade && q.lessonId===lessonId) return;
    const lesson = findLesson(subject, grade, lessonId);
    if(!lesson) { appState.quiz = null; return; }
    appState.quiz = {
      subject, grade, lessonId,
      order: shuffleIdx(lesson.questions.length),
      idx: 0,
      answers: {},
      submitted: false
    };
  }

  function renderQuizScreen(subject, grade, lessonId){
    const meta = subjectMeta(subject);
    const lesson = findLesson(subject, grade, lessonId);
    if(!lesson || !lesson.questions || lesson.questions.length === 0){
      return `<div class="empty-state"><div class="big">No quiz available</div><p><a data-nav="#/subject/${meta.key}/grade/${grade}/lesson/${lessonId}">Back to lesson</a></p></div>`;
    }
    initQuizIfNeeded(subject, grade, lessonId);
    const quiz = appState.quiz;
    const total = quiz.order.length;

    if(quiz.submitted){
      let correctCount = 0;
      const rows = quiz.order.map((qi, i) => {
        const question = lesson.questions[qi];
        const userAns = quiz.answers[i];
        const isCorrect = userAns === question.correct;
        if(isCorrect) correctCount++;
        return `
          <div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">
            <div class="q">${i+1}. ${escapeHtml(question.q)}</div>
            <div class="a-line ${isCorrect ? '' : 'wrong-answer'}">Your answer: ${userAns==null ? '<em>skipped</em>' : escapeHtml(question.options[userAns])}</div>
            ${!isCorrect ? `<div class="a-line right-answer">Correct answer: ${escapeHtml(question.options[question.correct])}</div>` : ''}
            ${question.explanation ? `<div class="explain">${escapeHtml(question.explanation)}</div>` : ''}
          </div>
        `;
      }).join('');
      const pct = Math.round((correctCount/total)*100);
      return `
        <div class="quiz-wrap result-wrap">
          <div class="stamp-seal"><div class="pct">${pct}%</div><div class="lbl">SCORE</div></div>
          <p class="result-summary">You got <strong>${correctCount} of ${total}</strong> correct on <strong>${escapeHtml(lesson.title)}</strong>.</p>
          <div class="review-list">${rows}</div>
          <div class="result-actions">
            <button class="btn stamp-btn" data-action="retake-quiz">Retake quiz</button>
            <button class="btn outline" data-nav="#/subject/${meta.key}/grade/${grade}/lesson/${lessonId}">Back to lesson</button>
          </div>
        </div>
      `;
    }

    const qIndex = quiz.order[quiz.idx];
    const question = lesson.questions[qIndex];
    const selected = quiz.answers[quiz.idx];
    const letters = ['A','B','C','D','E','F'];
    return `
      <div class="quiz-wrap">
        <div class="quiz-progress">
          <span class="count">${escapeHtml(lesson.title)}</span>
          <span class="count">Question ${quiz.idx+1} of ${total}</span>
        </div>
        <div class="progress-bar"><div class="fill" style="width:${((quiz.idx)/total)*100}%"></div></div>
        <div class="quiz-question">
          ${question.image ? `<img src="${escapeHtml(question.image)}" alt="" onerror="this.style.display='none'">` : ''}
          <h3>${escapeHtml(question.q)}</h3>
          <div class="options">
            ${question.options.map((opt, i) => `
              <button type="button" class="option-btn ${selected===i?'selected':''}" data-action="select-answer" data-value="${i}">
                <span class="letter">${letters[i]||i+1}</span> ${escapeHtml(opt)}
              </button>
            `).join('')}
          </div>
        </div>
        <div class="quiz-nav">
          <button class="btn outline" data-action="prev-question" ${quiz.idx===0?'disabled':''}>Previous</button>
          <button class="btn stamp-btn" data-action="next-question" ${selected==null?'disabled':''}>${quiz.idx===total-1 ? 'Finish' : 'Next'}</button>
        </div>
      </div>
    `;
  }

  /* ---------------- global event delegation ---------------- */
  document.addEventListener('click', function(e){
    const navEl = e.target.closest('[data-nav]');
    if(navEl){ navigate(navEl.getAttribute('data-nav')); return; }

    const actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    const action = actionEl.getAttribute('data-action');
    
    switch(action){
      case 'select-answer': {
        if(appState.quiz){
          appState.quiz.answers[appState.quiz.idx] = parseInt(actionEl.getAttribute('data-value'),10);
          render();
        }
        break;
      }
      case 'next-question': {
        const quiz = appState.quiz;
        if(!quiz) break;
        if(quiz.idx < quiz.order.length-1) quiz.idx++;
        else quiz.submitted = true;
        render(); break;
      }
      case 'prev-question': {
        if(appState.quiz && appState.quiz.idx > 0){ appState.quiz.idx--; render(); }
        break;
      }
      case 'retake-quiz': {
        const r = appState.route;
        appState.quiz = null;
        initQuizIfNeeded(r.subject, r.grade, r.lessonId);
        render(); break;
      }
    }
  });

  window.addEventListener('hashchange', function(){ appState.route = parseHash(); render(); });

  /* ---------------- init ---------------- */
  loadData();
</script>
</body>
</html>
