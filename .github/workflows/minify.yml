name: Minify Files

on:
  push:
    paths:
      - 'index.html'
      - 'data.json'
  workflow_dispatch:

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Minifiers
        run: npm install -g html-minifier-terser clean-css-cli

      - name: Minify HTML
        run: |
          html-minifier-terser index.html -o index.min.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true

      - name: Minify JSON
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            fs.writeFileSync('data.json', JSON.stringify(data));
          "

      - name: Copy minified HTML
        run: mv index.min.html index.html

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git diff --staged --quiet || git commit -m "⚡ Minify CSS/HTML/JSON"
          git push
