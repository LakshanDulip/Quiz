            } catch (e) {
                console.error('Cancel rematch error:', e);
            }
        }

        // =========================================================
        // TIMER
        // =========================================================
        function startQuestionTimer(data) {
            if (questionTimer) clearInterval(questionTimer);
            const totalTime = data.questionTime || gameQuestionTime || 15;
            const startMs = data.questionStartTime || Date.now();
            currentQuestionStartMs = startMs;
            currentQuestionTotalTime = totalTime;

            function computeTimeLeft() {
                const elapsed = (Date.now() - startMs) / 1000;
                return Math.max(0, Math.ceil(totalTime - elapsed));
            }
            questionTimeLeft = computeTimeLeft();

            questionTimer = setInterval(async () => {
                questionTimeLeft = computeTimeLeft();

                requestAnimationFrame(() => {
                    const timerEl = document.getElementById('timerDisplay');
                    const ringEl = document.getElementById('timerRingProgress');
                    const wrapEl = document.getElementById('timerWrap');
                    if (timerEl) timerEl.textContent = questionTimeLeft;
                    if (ringEl) {
                        const circumference = 2 * Math.PI * 52;
                        const frac = Math.max(0, questionTimeLeft / totalTime);
                        pulseWillChange(ringEl, 'stroke-dashoffset', 1100);
                        ringEl.style.strokeDashoffset = circumference * (1 - frac);
                        ringEl.setAttribute('class', 'timer-ring-progress ' + getTimerColorClass(frac));
                    }
                    if (questionTimeLeft <= 5 && questionTimeLeft > 0) {
                        if (wrapEl) wrapEl.classList.add('urgent');
                    } else if (questionTimeLeft > 0) {
                        if (wrapEl) wrapEl.classList.remove('urgent');
                    }
                });

                if (questionTimeLeft <= 5 && questionTimeLeft > 0) {
                    playSound('urgentTick');
                } else if (questionTimeLeft > 0) {
                    playSound('tick');
                }

                if (questionTimeLeft <= 0) {
                    clearInterval(questionTimer);
                    questionTimer = null;
                    revealActive = true;
                    if (data && data.questions) {
                        updateQuestionOptionsDOM(data);
                    }
                    if (selectedAnswer >= 0) {
                        const correctIdx = data.questions[currentQuestionIndex]?.correct;
                        const wasCorrect = selectedAnswer === correctIdx;
                        playSound(wasCorrect ? 'correct' : 'wrong');
                        vibrate(wasCorrect ? 15 : 10);
                        if (wasCorrect) flashCorrectFX();
                    }

                    if (isHost && roomId && !scoringInProgress) {
                        scoringInProgress = true;
                        const qRef = doc(db, 'liveMatches', roomId);
                        try {
                            let scoredQIndex = null;
                            let totalQuestions = 0;
                            await runTransaction(db, async (tx) => {
                                const snap = await tx.get(qRef);
                                if (!snap.exists()) return;
                                const qData = snap.data();
                                if (qData.status !== 'playing') return;
                                const questions = qData.questions || [];
                                const qIndex = qData.currentQuestion || 0;
                                const correctAnswer = questions[qIndex]?.correct || 0;
                                let updatePayload = { status: 'leaderboard' };
                                Object.entries(qData.players || {}).forEach(([uid, p]) => {
                                    if (p.online && p.answered) {
                                        const isCorrect = p.answer === correctAnswer;
                                        updatePayload[`players.${uid}.score`] = (p.score || 0) + (
                                            isCorrect ? 10 : 0);
                                        updatePayload[`players.${uid}.correct`] = (p.correct || 0) + (
                                            isCorrect ? 1 : 0);
                                        updatePayload[`players.${uid}.wrong`] = (p.wrong || 0) + (isCorrect ? 0 :
                                            1);
                                        const newStreak = isCorrect ? (p.streak || 0) + 1 : 0;
                                        updatePayload[`players.${uid}.streak`] = newStreak;
                                        updatePayload[`players.${uid}.longestStreak`] = Math.max(p.longestStreak ||
                                            0, newStreak);
                                        if (p.answerTime && qData.questionStartTime) {
                                            const respSec = Math.max(0, (p.answerTime - qData.questionStartTime) /
                                                1000);
                                            updatePayload[`players.${uid}.totalTime`] = (p.totalTime || 0) + respSec;
                                            const prevFastest = p.fastestTime;
                                            updatePayload[`players.${uid}.fastestTime`] = (prevFastest ===
                                                undefined || prevFastest === null || respSec <
                                                prevFastest) ? respSec : prevFastest;
                                        }
                                    }
                                    updatePayload[`players.${uid}.answered`] = false;
                                });
                                tx.update(qRef, updatePayload);
                                scoredQIndex = qIndex;
                                totalQuestions = questions.length;
                            });
                            if (scoredQIndex !== null) {
                                setTimeout(async () => {
                                    const nextQ = scoredQIndex + 1;
                                    if (nextQ >= totalQuestions) await updateDoc(qRef, { status: 'finished' });
                                    else await updateDoc(qRef, { status: 'playing', currentQuestion: nextQ,
                                        questionStartTime: Date.now() });
                                }, 4000);
                            }
                        } catch (e) { console.error(e); } finally { scoringInProgress = false; }
                    }
                }
            }, 1000);
        }

        function getScores(players) {
            const scores = {};
            Object.entries(players).forEach(([uid, p]) => { scores[uid] = { score: p.score || 0, correct: p.correct || 0,
                    wrong: p.wrong || 0 }; });
            return scores;
        }

        function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;' }[c])); }

        function getAvatarColor(uid) { const colors = ['#38bdf8', '#818cf8', '#34d399', '#fbbf24', '#f87171', '#a78bfa',
                '#fb923c', '#f472b6'
            ]; return colors[uid.charCodeAt(0) % colors.length]; }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            if (!el) return;
            el.textContent = msg;
            el.classList.remove('mp-error-shake');
            void el.offsetWidth;
            el.classList.add('mp-error-shake');
        }

        async function saveMatchHistory(data) {
            try {
                const playerArray = Object.entries(data.players || {}).map(([uid, p]) => ({ name: p.name, score: p.score ||
                        0, correct: p.correct || 0, wrong: p.wrong || 0 })).sort((a, b) => b.score - a.score);
                playerArray.forEach((p, i) => p.rank = i + 1);
                const winnerName = (data.forcedWinner && data.players && data.players[data.forcedWinner]) ?
                    data.players[data.forcedWinner].name : (playerArray[0]?.name || 'N/A');
                await addDoc(collection(db, 'matchHistory'), {
                    roomCode: data.roomCode,
                    date: serverTimestamp(),
                    hostName: data.hostName,
                    winner: winnerName,
                    players: playerArray,
                    totalQuestions: data.questions?.length || 0
                });
                await updateDoc(doc(db, 'liveMatches', roomId), { historySaved: true });
            } catch (e) {}
        }

        // =========================================================
        // CHAT CACHE (IndexedDB)
        // =========================================================
        const CHAT_DB_NAME = 'quizhub_chat_cache';
        const CHAT_DB_VERSION = 1;
        const CHAT_STORE = 'chatCache';

        function openChatDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) { reject(new Error('IndexedDB unavailable'));
                    return; }
                const req = indexedDB.open(CHAT_DB_NAME, CHAT_DB_VERSION);
                req.onupgradeneeded = () => {
                    const idb = req.result;
                    if (!idb.objectStoreNames.contains(CHAT_STORE)) {
                        idb.createObjectStore(CHAT_STORE, { keyPath: 'roomId' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveChatCache(rId, messages) {
            if (!rId) return;
            try {
                const idb = await openChatDB();
                const plain = messages.slice(-50).map(m => ({
                    ...m,
                    timestamp: (m.timestamp && typeof m.timestamp.toMillis === 'function') ? m.timestamp.toMillis() :
                        (typeof m.timestamp === 'number' ? m.timestamp : Date.now())
                }));
                const tx = idb.transaction(CHAT_STORE, 'readwrite');
                tx.objectStore(CHAT_STORE).put({ roomId: rId, messages: plain, savedAt: Date.now() });
                await new Promise((res) => { tx.oncomplete = res;
                    tx.onerror = res; });
            } catch (e) {}
        }

        async function loadChatCache(rId) {
            if (!rId) return [];
            try {
                const idb = await openChatDB();
                const tx = idb.transaction(CHAT_STORE, 'readonly');
                const req = tx.objectStore(CHAT_STORE).get(rId);
                return await new Promise((resolve) => {
                    req.onsuccess = () => resolve(req.result ? req.result.messages : []);
                    req.onerror = () => resolve([]);
                });
            } catch (e) { return []; }
        }

        // =========================================================
        // CHAT
        // =========================================================
        async function startChatListener() {
            if (chatUnsubscribe || !roomId) return;
            const rIdAtStart = roomId;
            try {
                const cached = await loadChatCache(rIdAtStart);
                if (cached && cached.length && chatMessages.length === 0 && roomId === rIdAtStart && !chatUnsubscribe) {
                    chatMessages = cached;
                    renderChatMessages();
                }
            } catch (e) {}
            if (chatUnsubscribe || roomId !== rIdAtStart) return;
            const chatQ = query(collection(db, 'liveMatches', roomId, 'chat'), orderBy('timestamp', 'asc'), limitToLast(
                50));
            chatUnsubscribe = onSnapshot(chatQ, (snap) => {
                chatMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderChatMessages();
                saveChatCache(roomId, chatMessages);
            }, () => {});
        }

        function stopChatListener() {
            if (chatUnsubscribe) { chatUnsubscribe();
                chatUnsubscribe = null; }
            chatMessages = [];
        }

        function renderChatMessages() {
            const box = document.getElementById('chatMessages');
            if (!box) return;
            box.innerHTML = chatMessages.map(m => {
                if (m.type === 'system') {
                    return `<div class="chat-msg-system">${escapeHtml(m.message)}</div>`;
                }
                const time = (m.timestamp && typeof m.timestamp.toDate === 'function') ? m.timestamp.toDate() :
                    (typeof m.timestamp === 'number' ? new Date(m.timestamp) : new Date());
                const hh = String(time.getHours()).padStart(2, '0');
                const mm = String(time.getMinutes()).padStart(2, '0');
                const mine = currentUser && m.playerId === currentUser.uid;
                return `
              <div class="chat-msg ${mine ? 'mine' : ''}">
                <div class="chat-msg-meta"><span class="chat-msg-name">${escapeHtml(m.playerName || 'Player')}</span><span class="chat-msg-time">${hh}:${mm}</span></div>
                <div class="chat-msg-bubble">${escapeHtml(m.message || '')}</div>
              </div>`;
            }).join('');
            box.scrollTop = box.scrollHeight;
        }

        async function addSystemChatMessage(rId, text) {
            if (!rId) return;
            try {
                await addDoc(collection(db, 'liveMatches', rId, 'chat'), {
                    type: 'system',
                    playerId: 'system',
                    playerName: 'System',
                    message: text,
                    timestamp: serverTimestamp()
                });
            } catch (e) {}
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if (!input || !roomId || chatSending) return;
            const raw = input.value.trim();
            if (!raw) return;
            const text = raw.slice(0, 150);
            const now = Date.now();
            if (now - lastChatSendAt < 900) return;
            chatSending = true;
            const sendBtn = document.getElementById('chatSendBtn');
            if (sendBtn) sendBtn.disabled = true;
            try {
                await addDoc(collection(db, 'liveMatches', roomId, 'chat'), {
                    type: 'user',
                    playerId: currentUser.uid,
                    playerName: playerName || 'Player',
                    message: text,
                    timestamp: serverTimestamp()
                });
                lastChatSendAt = now;
                input.value = '';
            } catch (e) {
                showToast('❌ Message send failed. Check connection.');
            }
            chatSending = false;
            if (sendBtn) sendBtn.disabled = false;
            input.focus();
        }

        function handleChatKeydown(e) {
            if (e.key === 'Enter') { e.preventDefault();
                sendChatMessage(); }
        }
        window.sendChatMessage = sendChatMessage;
        window.handleChatKeydown = handleChatKeydown;

        // =========================================================
        // PRESENCE
        // =========================================================
        function startHeartbeat() {
            stopHeartbeat();
            heartbeatInterval = setInterval(() => {
                if (roomId && currentUser) {
                    updateDoc(doc(db, 'liveMatches', roomId), {
                        [`players.${currentUser.uid}.online`]: true,
                        [`players.${currentUser.uid}.lastSeen`]: serverTimestamp()
                    }).catch(() => {});
                }
            }, 15000);
        }

        function stopHeartbeat() {
            if (heartbeatInterval) { clearInterval(heartbeatInterval);
                heartbeatInterval = null; }
        }

        async function maintainPresence(data, players) {
            if (!roomId || !currentUser) return;
            const now = Date.now();
            const updates = {};
            const onlineUids = [];
            const uidsToRemove = [];
            Object.entries(players).forEach(([uid, p]) => {
                const lastSeenMs = (p.lastSeen && typeof p.lastSeen.toMillis === 'function') ? p.lastSeen
                    .toMillis() : null;
                const stale = p.online && lastSeenMs && (now - lastSeenMs > PRESENCE_STALE_MS) && uid !==
                    currentUser.uid;
                if (stale) {
                    updates[`players.${uid}.online`] = false;
                } else if (p.online) {
                    onlineUids.push(uid);
                }
                if (!p.online && data.status === 'waiting' && lastSeenMs && (now - lastSeenMs > INACTIVE_REMOVE_MS) &&
                    uid !== currentUser.uid) {
                    uidsToRemove.push(uid);
                }
            });
            const hostEntry = players[data.hostId];
            const hostLastSeenMs = (hostEntry?.lastSeen && typeof hostEntry.lastSeen.toMillis === 'function') ? hostEntry
                .lastSeen.toMillis() : null;
            const hostLooksGone = !hostEntry || !hostEntry.online || (hostLastSeenMs && (now - hostLastSeenMs >
                PRESENCE_STALE_MS));
            if (hostLooksGone && onlineUids.length > 0) {
                const nextHost = [...onlineUids].sort()[0];
                if (nextHost === currentUser.uid && data.hostId !== currentUser.uid) {
                    updates.hostId = currentUser.uid;
                }
            }
            if (data.status !== 'waiting' && data.status !== 'finished' && onlineUids.length === 1 && !updates.status) {
                updates.status = 'finished';
                updates.forcedWinner = onlineUids[0];
                updates.hostId = onlineUids[0];
            }
            const shouldActAsCleaner = onlineUids.length === 0 || [...onlineUids].sort()[0] === currentUser.uid;
            if (uidsToRemove.length > 0 && shouldActAsCleaner && !presenceCleanupInFlight) {
                uidsToRemove.forEach(uid => { updates[`players.${uid}`] = deleteField(); });
            }
            if (Object.keys(updates).length > 0) {
                presenceCleanupInFlight = true;
                try { await updateDoc(doc(db, 'liveMatches', roomId), updates); } catch (e) {}
                presenceCleanupInFlight = false;
            }
            if (onlineUids.length === 0 && Object.keys(players).length > 0) {
                try { await deleteRoomCompletely(roomId); } catch (e) {}
            }

            // --- NEW: Rematch cleanup on host disconnect or requester leave ---
            // Check if there's a pending rematch request
            const rematch = data.rematch || {};
            if (rematch.status === 'pending') {
                const requesterUid = rematch.requestedBy;
                const requesterOnline = requesterUid && players[requesterUid]?.online;
                const hostOnline = data.hostId && players[data.hostId]?.online;
                const hostIsCurrent = data.hostId === currentUser.uid;

                // If the requester is no longer online, cancel the request
                if (requesterUid && !requesterOnline) {
                    await cancelRematchRequest('cancelled', '❌ Rematch request cancelled — requester left.');
                    return;
                }

                // If the host is no longer online, cancel the request
                if (data.hostId && !hostOnline && hostIsCurrent) {
                    await cancelRematchRequest('cancelled', '❌ Rematch request cancelled — host left.');
                    return;
                }

                // If host is online but not the current user, and we're the host, we handle it above
                // If host is offline and we're not the host, we can't do anything directly, but
                // the presence system will handle it on the next tick.
            }
        }

        async function deleteRoomCompletely(rId) {
            try {
                const chatSnap = await getDocs(collection(db, 'liveMatches', rId, 'chat'));
                if (!chatSnap.empty) {
                    const batch = writeBatch(db);
                    chatSnap.forEach(d => batch.delete(d.ref));
                    await batch.commit();
                }
            } catch (e) {}
            try { await deleteDoc(doc(db, 'liveMatches', rId)); } catch (e) {}
        }

        // =========================================================
        // RECONNECT
        // =========================================================
        function saveActiveRoom() {
            try { localStorage.setItem('quizhub_active_room', JSON.stringify({ roomId, roomCode })); } catch (e) {}
        }

        function loadActiveRoom() {
            try { const raw = localStorage.getItem('quizhub_active_room'); return raw ? JSON.parse(raw) : null; } catch (
                e) { return null; }
        }

        function clearActiveRoom() {
            try { localStorage.removeItem('quizhub_active_room'); } catch (e) {}
        }

        window.createRoom = createRoom;
        window.updateSettingsLessons = updateSettingsLessons;
        window.confirmCreateRoom = confirmCreateRoom;
        window.joinRoom = joinRoom;
        window.toggleReady = toggleReady;
        window.startGame = startGame;
        window.toggleMute = toggleMute;

        // =========================================================
        // INIT
        // =========================================================
        async function init() {
            updateMuteBtn();
            initParticles();
            renderSkeleton();
            await initAuth();
            const params = new URLSearchParams(window.location.search);
            const urlRoomCode = params.get('room');
            let reconnected = false;
            try {
                if (urlRoomCode) {
                    const code = urlRoomCode.trim().toUpperCase();
                    const q = query(collection(db, 'liveMatches'), where('roomCode', '==', code), where('status', 'in', [
                        'waiting', 'countdown', 'playing', 'leaderboard'
                    ]));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        const docSnap = snap.docs[0];
                        const data = docSnap.data();
                        if (data.players && data.players[currentUser.uid]) {
                            roomId = docSnap.id;
                            roomCode = data.roomCode;
                            playerName = data.players[currentUser.uid].name || playerName;
                            isHost = data.hostId === currentUser.uid;
                            previousPlayers = null;
                            previousScores = {};
                            previousRanks = {};
                            qrRendered = false;
                            waitingRoomFullyRendered = false;
                            prevSnapshotStatus = null;
                            prevSnapshotQuestionIndex = -1;
                            prevSnapshotPlayersJSON = '';
                            answeredQuestionIndices = new Set();
                            rematchPending = false;
                            rematchRequestedBy = null;
                            rematchRequestedByName = '';
                            saveActiveRoom();
                            listenToRoom();
                            reconnected = true;
                        }
                    }
                } else {
                    const saved = loadActiveRoom();
                    if (saved && saved.roomId) {
                        const roomSnap = await getDoc(doc(db, 'liveMatches', saved.roomId));
                        if (roomSnap.exists() && roomSnap.data().players && roomSnap.data().players[currentUser.uid]) {
                            const data = roomSnap.data();
                            roomId = saved.roomId;
                            roomCode = data.roomCode;
                            playerName = data.players[currentUser.uid].name || playerName;
                            isHost = data.hostId === currentUser.uid;
                            previousPlayers = null;
                            previousScores = {};
                            previousRanks = {};
                            qrRendered = false;
                            waitingRoomFullyRendered = false;
                            prevSnapshotStatus = null;
                            prevSnapshotQuestionIndex = -1;
                            prevSnapshotPlayersJSON = '';
                            answeredQuestionIndices = new Set();
                            rematchPending = false;
                            rematchRequestedBy = null;
                            rematchRequestedByName = '';
                            listenToRoom();
                            reconnected = true;
                        } else {
                            clearActiveRoom();
                        }
                    }
                }
            } catch (e) { console.error('Reconnect check failed:', e); }
            if (!reconnected) {
                renderLobby();
                if (urlRoomCode) {
                    setTimeout(() => {
                        const el = document.getElementById('roomCodeInput');
                        if (el) { el.value = urlRoomCode;
                            joinRoom(); }
                    }, 500);
                }
            }
        }
        init();
    </script>
