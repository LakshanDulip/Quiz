<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Hub - Multiplayer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/multiplayer.css">
  <style>
    .home-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.3s;
    }
    .home-link:hover { border-color: var(--primary); color: var(--primary); }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="home-link">← Home</a>
  
  <div class="mp-container" id="app"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhfgx0t-E6wrz6zEFIU_tpKTIbELp00ss",
      authDomain: "quiz-hub-225eb.firebaseapp.com",
      projectId: "quiz-hub-225eb",
      storageBucket: "quiz-hub-225eb.firebasestorage.app",
      messagingSenderId: "387012755680",
      appId: "1:387012755680:web:36108ab447a8a2f2ab9085"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ============ STATE ============
    let currentUser = null;
    let roomId = null;
    let roomCode = null;
    let isHost = false;
    let playerName = '';
    let unsubscribe = null;
    let gameState = 'lobby'; 
    let currentQuestionIndex = 0;
    let selectedAnswer = -1;
    let questionTimer = null;
    let questionTimeLeft = 15;
    let gameQuestionTime = 15;

    // ============ AUTH ============
    async function initAuth() {
      return new Promise((resolve) => {
        onAuthStateChanged(auth, async (user) => {
          if (user) {
            currentUser = user;
            resolve(user);
          } else {
            await signInAnonymously(auth);
          }
        });
      });
    }

    // ============ UI RENDER & EVENT BINDING ============
    function render(html) {
      document.getElementById('app').innerHTML = html;
    }

    // 1. LOBBY
    function renderLobby() {
      render(`
        <div class="mp-card">
          <div class="mp-title">⚡ Quiz Hub Multiplayer</div>
          <input type="text" class="mp-input" id="playerName" placeholder="ඔබේ නම..." maxlength="20" value="${playerName}">
          <button class="mp-btn mp-btn-primary" id="btnCreateRoom">🏠 Create Room</button>
          
          <div class="mp-divider">OR</div>
          
          <input type="text" class="mp-input" id="roomCodeInput" placeholder="Room Code" maxlength="6" style="text-align:center;letter-spacing:4px;text-transform:uppercase;font-size:1.2rem;">
          <button class="mp-btn mp-btn-outline" id="btnJoinRoom">🚪 Join Room</button>
          <div class="mp-error" id="errorMsg"></div>
        </div>
      `);

      document.getElementById('btnCreateRoom').addEventListener('click', () => {
        playerName = document.getElementById('playerName').value.trim() || 'Player';
        renderCreateSettings();
      });

      document.getElementById('btnJoinRoom').addEventListener('click', () => {
        joinRoom();
      });
    }

    // 2. SETTINGS
    function renderCreateSettings() {
      render(`
        <div class="mp-card">
          <div class="mp-title">⚙️ Game Settings</div>
          
          <label style="font-size:0.8rem;color:var(--text2);">Subject</label>
          <select class="mp-select" id="setSubject">
            <option value="science">🔬 විද්‍යාව</option>
            <option value="maths">📐 ගණිතය</option>
          </select>
          
          <label style="font-size:0.8rem;color:var(--text2);">Grade</label>
          <select class="mp-select" id="setGrade">
            <option value="8">8 ශ්‍රේණිය</option>
            <option value="9">9 ශ්‍රේණිය</option>
            <option value="10">10 ශ්‍රේණිය</option>
            <option value="11">11 ශ්‍රේණිය</option>
          </select>
          
          <label style="font-size:0.8rem;color:var(--text2);">Lesson</label>
          <select class="mp-select" id="setLesson">
            <option value="">Loading...</option>
          </select>
          
          <label style="font-size:0.8rem;color:var(--text2);">Questions (10-30)</label>
          <input type="number" class="mp-input" id="setQCount" value="10" min="10" max="30">
          
          <label style="font-size:0.8rem;color:var(--text2);">Time per Question (seconds)</label>
          <select class="mp-select" id="setQTime">
            <option value="10">10s - Fast ⚡</option>
            <option value="15" selected>15s - Normal</option>
            <option value="20">20s - Easy</option>
            <option value="30">30s - Relaxed</option>
          </select>
          
          <button class="mp-btn mp-btn-primary" id="btnConfirmCreate">✅ Create Room</button>
          <button class="mp-btn mp-btn-outline" id="btnBackLobby">Back</button>
        </div>
      `);

      document.getElementById('setSubject').addEventListener('change', async () => {
        document.getElementById('setLesson').innerHTML = '<option value="">Loading...</option>';
        await updateSettingsLessons();
      });

      document.getElementById('setGrade').addEventListener('change', async () => {
        await updateSettingsLessons();
      });

      document.getElementById('btnConfirmCreate').addEventListener('click', confirmCreateRoom);
      document.getElementById('btnBackLobby').addEventListener('click', renderLobby);

      updateSettingsLessons(); 
    }

    // ============ DATA LOADING FUNCTIONS ============
    async function updateSettingsLessons() {
      const subject = document.getElementById('setSubject')?.value || 'science';
      const grade = document.getElementById('setGrade')?.value || '8';
      const select = document.getElementById('setLesson');
      if (!select) return;
      
      try {
        const resp = await fetch(`data/${subject}.json`);
        if (!resp.ok) throw new Error('Failed to load JSON');
        const data = await resp.json();
        
        let lessons = [];
        
        // Auto-search for lessons
        if (data.grades?.[grade]?.lessons) {
          lessons = data.grades[grade].lessons;
        } else if (data[subject]?.grades?.[grade]?.lessons) {
          lessons = data[subject].grades[grade].lessons;
        } else if (data.subjects?.[subject]?.grades?.[grade]?.lessons) {
          lessons = data.subjects[subject].grades[grade].lessons;
        } else {
          for (let key in data) {
            if (data[key]?.grades?.[grade]?.lessons) {
              lessons = data[key].grades[grade].lessons;
              break;
            }
          }
        }
        
        if (!lessons || lessons.length === 0) {
          select.innerHTML = '<option value="">No lessons found</option>';
          return;
        }
        
        select.innerHTML = lessons.map(l => 
          `<option value="${l.id}">${escapeHtml(l.title)} (${l.questions?.length || 0} Q)</option>`
        ).join('');
      } catch(e) {
        console.error(e);
        select.innerHTML = '<option value="">Error loading</option>';
      }
    }

    // ============ ROOM LOGIC ============
    async function confirmCreateRoom() {
      const subject = document.getElementById('setSubject')?.value || 'science';
      const grade = document.getElementById('setGrade')?.value || '10';
      const lessonId = document.getElementById('setLesson')?.value;
      const qCount = parseInt(document.getElementById('setQCount')?.value || 10);
      const qTime = parseInt(document.getElementById('setQTime')?.value || 15);
      
      if (!lessonId) return showError('Lesson තෝරන්න!');
      if (qCount < 10 || qCount > 30) return showError('Questions 10-30 විය යුතුයි!');
      
      gameQuestionTime = qTime;
      roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
      roomId = `room_${Date.now()}`;
      isHost = true;

      let questions = [];
      try {
        const resp = await fetch(`data/${subject}.json`);
        const data = await resp.json();
        let lessons = [];
        
        if (data.grades?.[grade]?.lessons) {
          lessons = data.grades[grade].lessons;
        } else if (data[subject]?.grades?.[grade]?.lessons) {
          lessons = data[subject].grades[grade].lessons;
        } else if (data.subjects?.[subject]?.grades?.[grade]?.lessons) {
          lessons = data.subjects[subject].grades[grade].lessons;
        } else {
          for (let key in data) {
            if (data[key]?.grades?.[grade]?.lessons) {
              lessons = data[key].grades[grade].lessons;
              break;
            }
          }
        }
        
        const lesson = lessons.find(l => l.id === lessonId);
        if (lesson?.questions) {
          const shuffled = [...lesson.questions].sort(() => Math.random() - 0.5);
          questions = shuffled.slice(0, qCount);
        }
      } catch(e) {}
      
      if (questions.length === 0) {
        questions = [
          {q:"Sample Q1? (No questions found in JSON)", options:["A","B","C","D"], correct:0},
          {q:"Sample Q2?", options:["A","B","C","D"], correct:1}
        ];
      }

      await setDoc(doc(db, 'liveMatches', roomId), {
        roomCode,
        hostId: currentUser.uid,
        hostName: playerName,
        subject, grade, lessonId,
        questionTime: qTime,
        questionCount: questions.length,
        status: 'waiting',
        currentQuestion: -1,
        createdAt: serverTimestamp(),
        questions,
        players: {
          [currentUser.uid]: {
            name: playerName,
            score: 0, correct: 0, wrong: 0,
            answered: false, ready: false, online: true,
            joinedAt: new Date().toISOString()
          }
        }
      });

      listenToRoom();
    }

    async function joinRoom() {
      const code = document.getElementById('roomCodeInput')?.value.trim().toUpperCase();
      playerName = document.getElementById('playerName')?.value.trim() || 'Player';
      if (!code) return showError('Room code enter කරන්න!');
      
      roomCode = code;

      const q = query(collection(db, 'liveMatches'), where('roomCode', '==', code), where('status', 'in', ['waiting', 'countdown']));
      const snapshot = await getDocs(q);
      
      if (snapshot.empty) return showError('Room not found!');
      
      const docData = snapshot.docs[0];
      roomId = docData.id;
      isHost = false;

      const players = docData.data().players || {};
      if (Object.keys(players).length >= 10) return showError('Room is full (max 10)!');
      if (players[currentUser.uid]) return showError('You are already in this room!');

      await updateDoc(doc(db, 'liveMatches', roomId), {
        [`players.${currentUser.uid}`]: {
          name: playerName,
          score: 0, correct: 0, wrong: 0,
          answered: false, ready: false, online: true,
          joinedAt: new Date().toISOString()
        }
      });

      listenToRoom();
    }

    // ============ LISTENER ============
    function listenToRoom() {
      if (unsubscribe) unsubscribe();
      unsubscribe = onSnapshot(doc(db, 'liveMatches', roomId), (snapshot) => {
        if (!snapshot.exists()) { leaveRoom(); return; }
        
        const data = snapshot.data();
        const players = data.players || {};
        if (players[currentUser.uid]) players[currentUser.uid].online = true;

        switch(data.status) {
          case 'waiting':
            renderWaitingRoom(data);
            selectedAnswer = -1;
            break;

          case 'countdown':
            gameState = 'countdown';
            render(`
              <div class="mp-card" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height: 300px;">
                <div class="mp-title" style="font-size: 2rem;">Game is starting...</div>
                <div style="font-size: 4rem; margin-top: 20px; animation: pulse 1s infinite;">⏳</div>
              </div>
            `);
            selectedAnswer = -1;
            break;
            
          case 'playing':
            const isNewQuestion = currentQuestionIndex !== (data.currentQuestion || 0);
            currentQuestionIndex = data.currentQuestion || 0;
            if (gameState !== 'playing' || isNewQuestion) {
              gameState = 'playing'; selectedAnswer = -1; startQuestionTimer(data);
            }
            renderQuestion(data);
            break;
            
          case 'leaderboard':
            gameState = 'leaderboard';
            renderLeaderboard(players, getScores(players));
            break;
            
          case 'finished':
            gameState = 'finished';
            renderWinner(players, getScores(players), data);
            break;
        }
      });
    }

    // ============ GAME SCREENS ============
    function renderWaitingRoom(data) {
      const players = data.players || {};
      const playerList = Object.entries(players).map(([uid, p]) => `
        <div class="mp-player">
          <div class="mp-player-avatar" style="background:${getAvatarColor(uid)}">${(p.name||'?')[0].toUpperCase()}</div>
          <div class="mp-player-info">
            <div class="mp-player-name">${escapeHtml(p.name)} ${uid === data.hostId ? '<span class="mp-badge mp-badge-host">Host</span>' : ''}</div>
            <div class="mp-player-status">${p.online ? (p.ready ? '✅ Ready' : '⏳ Waiting') : '🔴 Offline'}</div>
          </div>
        </div>
      `).join('');
      const playerCount = Object.values(players).filter(p => p.online).length;
      const allReady = playerCount >= 2 && Object.values(players).filter(p => p.online).every(p => p.ready);

      render(`
        <div class="mp-card">
          <div class="mp-title">⏳ Waiting Room</div>
          <div class="mp-room-code">${roomCode}</div>
          <p style="text-align:center;">Players: ${playerCount}/10</p>
          <div class="mp-player-list">${playerList}</div>
          <button class="mp-btn mp-btn-success" id="btnReady">${players[currentUser.uid]?.ready ? '✅ Ready' : 'Click to Ready'}</button>
          ${isHost ? `<button class="mp-btn mp-btn-primary" id="btnStart" ${!allReady?'disabled':''}>⚡ Start</button>` : ''}
          <button class="mp-btn mp-btn-danger" id="btnLeave">Leave</button>
        </div>
      `);

      document.getElementById('btnReady').addEventListener('click', toggleReady);
      if(isHost && document.getElementById('btnStart')) {
          document.getElementById('btnStart').addEventListener('click', startGame);
      }
      document.getElementById('btnLeave').addEventListener('click', leaveRoom);
    }

    function renderQuestion(data) {
      const q = data.questions[currentQuestionIndex];
      if (!q) return;
      const options = q.options.map((opt, i) => `
        <button class="mp-option ans-btn ${selectedAnswer === i ? 'selected' : ''}" data-index="${i}" ${selectedAnswer >= 0 ? 'disabled' : ''}>
          ${String.fromCharCode(65+i)}) ${escapeHtml(opt)}
        </button>
      `).join('');
      render(`
        <div class="mp-card">
          <div class="mp-question-num">Question ${currentQuestionIndex + 1}/${data.questions.length}</div>
          <div class="mp-timer ${questionTimeLeft <= 5 ? 'urgent' : ''}" id="timerDisplay">${questionTimeLeft}s</div>
          <div class="mp-question-text">${escapeHtml(q.q)}</div>
          <div>${options}</div>
          <p style="text-align:center;font-size:0.7rem;color:var(--text2);margin-top:8px;">${selectedAnswer >= 0 ? 'Answer locked! 🔒' : 'Select your answer...'}</p>
        </div>
      `);

      document.querySelectorAll('.ans-btn').forEach(btn => {
        btn.addEventListener('click', (e) => selectAnswer(parseInt(e.currentTarget.dataset.index)));
      });
    }

    function renderLeaderboard(players, scores) {
      const sorted = Object.entries(players).map(([uid, p]) => ({ ...p, uid, score: scores[uid]?.score || 0 })).sort((a, b) => b.score - a.score);
      const list = sorted.map((p, i) => `
        <div class="mp-leaderboard-item">
          <div class="mp-rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i+1}</div>
          <div class="mp-player-avatar" style="background:${getAvatarColor(p.uid)}">${(p.name||'?')[0].toUpperCase()}</div>
          <div class="mp-player-info"><div class="mp-player-name">${escapeHtml(p.name)}</div><div class="mp-player-status">✅ ${p.correct || 0} / ❌ ${p.wrong || 0}</div></div>
          <div class="mp-player-score">${p.score}</div>
        </div>
      `).join('');
      render(`<div class="mp-card"><div class="mp-title">📊 Leaderboard</div><div>${list}</div><p style="text-align:center;font-size:0.7rem;color:var(--text2);margin-top:8px;">Next question coming...</p></div>`);
    }

    function renderWinner(players, scores, data) {
      const sorted = Object.entries(players).map(([uid, p]) => ({ ...p, uid, score: scores[uid]?.score || 0 })).sort((a, b) => b.score - a.score);
      const winner = sorted[0];
      const list = sorted.map((p, i) => `
        <div class="mp-leaderboard-item">
          <div class="mp-rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i+1}</div>
          <div class="mp-player-avatar" style="background:${getAvatarColor(p.uid)}">${(p.name||'?')[0].toUpperCase()}</div>
          <div class="mp-player-info"><div class="mp-player-name">${escapeHtml(p.name)}</div></div>
          <div class="mp-player-score">${p.score}</div>
        </div>
      `).join('');
      render(`
        <div class="mp-card">
          <div class="mp-winner"><div class="mp-winner-icon">🏆</div><div class="mp-winner-name">${escapeHtml(winner.name)}</div><p style="color:var(--text2);">${winner.score} points</p></div>
          <div>${list}</div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            ${isHost ? '<button class="mp-btn mp-btn-primary" id="btnRematch">🔄 Rematch</button>' : ''}
            <button class="mp-btn mp-btn-outline" id="btnLeaveEnd">Leave</button>
          </div>
        </div>
      `);
      
      if(isHost) document.getElementById('btnRematch').addEventListener('click', rematch);
      document.getElementById('btnLeaveEnd').addEventListener('click', leaveRoom);
      if (isHost && data && !data.historySaved) saveMatchHistory(data);
    }

    // ============ ACTIONS ============
    async function toggleReady() {
      if (!roomId) return;
      const roomRef = doc(db, 'liveMatches', roomId);
      const snap = await getDoc(roomRef);
      const currentReady = snap.data().players[currentUser.uid]?.ready || false;
      await updateDoc(roomRef, { [`players.${currentUser.uid}.ready`]: !currentReady });
    }

    async function startGame() {
      if (!isHost || !roomId) return;
      await updateDoc(doc(db, 'liveMatches', roomId), { status: 'countdown' });
      setTimeout(async () => {
        await updateDoc(doc(db, 'liveMatches', roomId), {
          status: 'playing', currentQuestion: 0, questionStartTime: Date.now()
        });
      }, 3000);
    }

    async function selectAnswer(index) {
      if (selectedAnswer >= 0 || !roomId) return;
      selectedAnswer = index;
      await updateDoc(doc(db, 'liveMatches', roomId), {
        [`players.${currentUser.uid}.answered`]: true,
        [`players.${currentUser.uid}.answer`]: index,
        [`players.${currentUser.uid}.answerTime`]: Date.now()
      });
    }

    async function leaveRoom() {
      if (roomId) {
        try {
          await updateDoc(doc(db, 'liveMatches', roomId), { [`players.${currentUser.uid}.online`]: false });
        } catch(e) {}
      }
      if (unsubscribe) unsubscribe();
      roomId = null; roomCode = null; isHost = false; selectedAnswer = -1;
      renderLobby();
    }

    async function rematch() {
      if (!isHost || !roomId) return;
      await updateDoc(doc(db, 'liveMatches', roomId), {
        status: 'waiting', currentQuestion: -1,
        'players': Object.fromEntries(
          Object.entries((await getDoc(doc(db, 'liveMatches', roomId))).data().players || {}).map(([uid, p]) => [uid, {...p, score:0, correct:0, wrong:0, answered:false, ready:false}])
        )
      });
    }

    // ============ TIMERS & SCORES ============
    function startQuestionTimer(data) {
      if (questionTimer) clearInterval(questionTimer);
      questionTimeLeft = data.questionTime || gameQuestionTime || 15;
      questionTimer = setInterval(async () => {
        questionTimeLeft--;
        const timerEl = document.getElementById('timerDisplay');
        if (timerEl) { timerEl.textContent = questionTimeLeft + 's'; if (questionTimeLeft <= 5) timerEl.classList.add('urgent'); }
        
        if (questionTimeLeft <= 0) {
          clearInterval(questionTimer); questionTimer = null;
          if (isHost && roomId) {
            const qRef = doc(db, 'liveMatches', roomId);
            const snap = await getDoc(qRef);
            const qData = snap.data();
            const questions = qData.questions || [];
            const qIndex = qData.currentQuestion || 0;
            const correctAnswer = questions[qIndex]?.correct || 0;
            
            let updatePayload = { status: 'leaderboard' };
            Object.entries(qData.players || {}).forEach(([uid, p]) => {
              if (p.online && p.answered) {
                const isCorrect = p.answer === correctAnswer;
                updatePayload[`players.${uid}.score`] = (p.score || 0) + (isCorrect ? 10 : 0);
                updatePayload[`players.${uid}.correct`] = (p.correct || 0) + (isCorrect ? 1 : 0);
                updatePayload[`players.${uid}.wrong`] = (p.wrong || 0) + (isCorrect ? 0 : 1);
              }
              updatePayload[`players.${uid}.answered`] = false;
            });
            
            await updateDoc(qRef, updatePayload);
            
            setTimeout(async () => {
              const nextQ = qIndex + 1;
              if (nextQ >= questions.length) await updateDoc(qRef, { status: 'finished' });
              else await updateDoc(qRef, { status: 'playing', currentQuestion: nextQ, questionStartTime: Date.now() });
            }, 4000);
          }
        }
      }, 1000);
    }

    function getScores(players) {
      const scores = {};
      Object.entries(players).forEach(([uid, p]) => { scores[uid] = { score: p.score || 0, correct: p.correct || 0, wrong: p.wrong || 0 }; });
      return scores;
    }

    // ============ UTILS ============
    function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function getAvatarColor(uid) { const colors = ['#38bdf8','#818cf8','#34d399','#fbbf24','#f87171','#a78bfa','#fb923c']; return colors[uid.charCodeAt(0) % colors.length]; }
    function showError(msg) { const el = document.getElementById('errorMsg'); if (el) el.textContent = msg; }
    
    async function saveMatchHistory(data) {
      try {
        const playerArray = Object.entries(data.players || {}).map(([uid, p]) => ({ name: p.name, score: p.score || 0, correct: p.correct || 0, wrong: p.wrong || 0 })).sort((a, b) => b.score - a.score);
        playerArray.forEach((p, i) => p.rank = i + 1);
        await addDoc(collection(db, 'matchHistory'), {
          roomCode: data.roomCode, date: serverTimestamp(), hostName: data.hostName,
          winner: playerArray[0]?.name || 'N/A', players: playerArray, totalQuestions: data.questions?.length || 0
        });
        await updateDoc(doc(db, 'liveMatches', roomId), { historySaved: true });
      } catch(e) {}
    }

    // ============ INIT ============
    async function init() {
      await initAuth();
      renderLobby();
      const params = new URLSearchParams(window.location.search);
      if (params.get('room')) {
        setTimeout(() => { document.getElementById('roomCodeInput').value = params.get('room'); joinRoom(); }, 500);
      }
    }

    init();
  </script>
</body>
</html>
