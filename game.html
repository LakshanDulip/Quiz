<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Quiz Hub - Multiplayer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #0a0e1a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --border: #334155;
            --primary: #38bdf8;
            --green: #34d399;
            --red: #f87171;
            --yellow: #fbbf24;
            --radius: 18px;
            --secondary: #818cf8;
            --accent-pink: #f472b6;
            --gold: #fbbf24;
            --silver: #cbd5e1;
            --bronze: #d97706;
            --glass-bg: rgba(30, 41, 59, 0.55);
            --glass-bg-strong: rgba(30, 41, 59, 0.78);
            --glass-border: rgba(148, 163, 184, 0.18);
            --glow-primary: 0 0 24px rgba(56, 189, 248, 0.35);
            --glow-gold: 0 0 28px rgba(251, 191, 36, 0.45);
            --ease-game: cubic-bezier(.22, 1, .36, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        html,
        body {
            height: 100%;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: calc(20px + var(--safe-top));
            padding-bottom: calc(20px + var(--safe-bottom));
            overflow-x: hidden;
            position: relative;
            background: #0a0e1a;
        }
        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: linear-gradient(125deg, #0a0e1a 0%, #131b2e 35%, #191233 65%, #0a0e1a 100%);
            background-size: 300% 300%;
            animation: gradientShift 18s ease infinite;
        }
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .bg-blobs {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.35;
            will-change: transform;
        }
        .blob1 {
            width: 420px;
            height: 420px;
            background: var(--primary);
            top: -10%;
            left: -10%;
            animation: floatBlob1 22s ease-in-out infinite;
        }
        .blob2 {
            width: 380px;
            height: 380px;
            background: var(--secondary);
            bottom: -15%;
            right: -10%;
            animation: floatBlob2 26s ease-in-out infinite;
        }
        .blob3 {
            width: 300px;
            height: 300px;
            background: var(--accent-pink);
            top: 40%;
            right: 20%;
            animation: floatBlob3 20s ease-in-out infinite;
            opacity: 0.22;
        }
        @keyframes floatBlob1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(60px, 80px) scale(1.15);
            }
        }
        @keyframes floatBlob2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-70px, -50px) scale(1.1);
            }
        }
        @keyframes floatBlob3 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(-40px, 60px) scale(1.2);
            }
        }
        #bgParticles,
        #confettiCanvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }
        #confettiCanvas {
            z-index: 999;
        }
        .mp-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        #app {
            will-change: opacity, transform;
        }
        #app.screen-fade-in {
            animation: screenFadeIn 0.4s var(--ease-game);
        }
        @keyframes screenFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .mp-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 26px 22px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: cardEnter 0.5s var(--ease-game);
            position: relative;
            overflow: hidden;
            contain: layout style paint;
        }
        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .mp-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #38bdf8, #818cf8 55%, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.3px;
        }
        .mp-input,
        .mp-select {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 12px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .mp-input:focus,
        .mp-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }
        .mp-select {
            font-size: 0.9rem;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px 12px;
        }
        .mp-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.18s var(--ease-game), box-shadow 0.25s, filter 0.2s;
            margin-bottom: 8px;
            position: relative;
            overflow: hidden;
            min-height: 48px;
        }
        .mp-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.06);
        }
        .mp-btn:active:not(:disabled) {
            transform: scale(0.96);
        }
        .mp-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }
        .mp-btn:focus-visible,
        .mp-option:focus-visible,
        .icon-btn:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }
        .mp-btn-primary {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #fff;
            box-shadow: 0 4px 18px rgba(56, 189, 248, 0.35);
        }
        .mp-btn-success {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #04231a;
            box-shadow: 0 4px 18px rgba(52, 211, 153, 0.3);
        }
        .mp-btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: #fff;
            box-shadow: 0 4px 18px rgba(248, 113, 113, 0.3);
        }
        .mp-btn-outline {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--border);
            color: var(--text);
        }
        .mp-btn-outline:hover:not(:disabled) {
            border-color: var(--primary);
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            background: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            animation: rippleAnim 0.6s ease-out forwards;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(3.2);
                opacity: 0;
            }
        }
        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 7px;
        }
        .mp-room-code {
            text-align: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 7px;
            margin: 8px 0 2px;
            color: var(--primary);
            text-shadow: 0 0 18px rgba(56, 189, 248, 0.5);
            cursor: pointer;
            animation: codeGlow 2.4s ease-in-out infinite;
            user-select: all;
        }
        @keyframes codeGlow {
            0%,
            100% {
                text-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
            }
            50% {
                text-shadow: 0 0 26px rgba(56, 189, 248, 0.75);
            }
        }
        .mp-copy-hint {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text2);
            margin-bottom: 14px;
        }
        .mp-copy-hint i {
            margin-right: 4px;
        }
        .invite-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--text);
            border-radius: 12px;
            padding: 10px 6px;
            font-size: 0.65rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 48px;
        }
        .icon-btn i {
            font-size: 1rem;
        }
        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }
        .icon-btn:active,
        .mp-option:active,
        .mp-btn:active {
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn.whatsapp:hover {
            border-color: #25D366;
            color: #25D366;
        }
        .qr-wrap {
            display: none;
            justify-content: center;
            padding: 14px;
            background: #f1f5f9;
            border-radius: 14px;
            margin-bottom: 14px;
        }
        .mp-player-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 12px 0;
            contain: layout style;
        }
        .mp-player-list::-webkit-scrollbar {
            width: 6px;
        }
        .mp-player-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 6px;
        }
        .mp-player {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 6px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            animation: playerEnter 0.4s var(--ease-game) both;
            transition: opacity 0.35s ease, transform 0.35s ease, max-height 0.35s ease, margin 0.35s ease, padding 0.35s ease;
        }
        .mp-player.player-entering {
            opacity: 0;
            transform: translateX(-16px);
        }
        .mp-player.player-leaving {
            opacity: 0;
            transform: translateX(18px) scale(0.96);
            max-height: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            overflow: hidden;
        }
        @keyframes playerEnter {
            from {
                opacity: 0;
                transform: translateX(-12px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .mp-player-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
        }
        .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 2px solid var(--bg);
        }
        .status-dot.online {
            background: var(--green);
            animation: dotPulse 1.6s ease-in-out infinite;
        }
        .status-dot.offline {
            background: var(--red);
        }
        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
            }
            50% {
                box-shadow: 0 0 0 4px rgba(52, 211, 153, 0);
            }
        }
        .mp-player-info {
            flex: 1;
            min-width: 0;
        }
        .mp-player-name {
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .mp-player-status {
            font-size: 0.7rem;
            color: var(--text2);
        }
        .mp-player-score {
            font-weight: 700;
            color: var(--primary);
            font-family: 'Space Grotesk', sans-serif;
        }
        .mp-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .mp-badge-host {
            background: rgba(251, 191, 36, 0.18);
            color: var(--yellow);
            position: relative;
        }
        .mp-badge-ready {
            background: rgba(52, 211, 153, 0.18);
            color: var(--green);
            animation: readyPop 0.4s var(--ease-game);
        }
        .mp-badge-waiting {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text2);
        }
        .mp-badge-rejoined {
            background: rgba(56, 189, 248, 0.18);
            color: var(--primary);
            animation: readyPop 0.4s var(--ease-game), rejoinedFade 3.5s ease-in forwards;
        }
        @keyframes rejoinedFade {
            0%,
            70% {
                opacity: 1;
            }
            100% {
                opacity: 0.55;
            }
        }
        @keyframes readyPop {
            0% {
                transform: scale(0.5);
            }
            60% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }
        .crown-sparkle {
            display: inline-block;
            margin-left: 2px;
            animation: sparkleTwinkle 1.6s ease-in-out infinite;
        }
        @keyframes sparkleTwinkle {
            0%,
            100% {
                opacity: 0.35;
                transform: scale(0.85) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.15) rotate(12deg);
            }
        }
        .mp-progress-bar {
            height: 5px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            margin-bottom: 14px;
        }
        .mp-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 4px;
            transition: width 0.6s var(--ease-game);
        }
        .mp-progress-dots {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .prog-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s var(--ease-game);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .prog-dot.current {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.65);
            transform: scale(1.35);
        }
        .prog-dot.answered {
            background: var(--green);
            border-color: var(--green);
        }
        .prog-dot.answered::after {
            content: '✓';
            position: absolute;
            font-size: 7px;
            font-weight: 800;
            color: #04231a;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .mp-question-num {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text2);
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .timer-ring-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
        }
        .timer-ring {
            width: 108px;
            height: 108px;
            transform: rotate(-90deg);
        }
        .timer-ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 8;
        }
        .timer-ring-progress {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
        }
        .timer-green {
            stroke: var(--green);
        }
        .timer-yellow {
            stroke: var(--yellow);
        }
        .timer-orange {
            stroke: #fb923c;
        }
        .timer-red {
            stroke: var(--red);
        }
        .timer-ring-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 800;
        }
        .timer-ring-wrap.urgent .timer-ring-text {
            animation: timerPulse 0.5s infinite;
            color: var(--red);
        }
        @keyframes timerPulse {
            50% {
                opacity: 0.4;
                transform: scale(1.08);
            }
        }
        .mp-question-text {
            text-align: center;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 18px;
            line-height: 1.6;
            font-family: 'Space Grotesk', sans-serif;
        }
        #questionCard {
            animation: cardEnter 0.5s var(--ease-game), questionSlideIn 0.45s var(--ease-game);
        }
        @keyframes questionSlideIn {
            from {
                opacity: 0;
                transform: translateX(24px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .mp-option {
            width: 100%;
            text-align: left;
            padding: 15px 16px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.5);
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s var(--ease-game);
            margin-bottom: 9px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mp-option .opt-letter {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
            transition: background 0.25s, color 0.25s;
        }
        .mp-option:hover:not(:disabled) {
            border-color: var(--primary);
            transform: translateX(4px);
        }
        .mp-option:active:not(:disabled) {
            transform: translateX(4px) scale(0.98);
        }
        .mp-option:disabled {
            cursor: default;
        }
        .mp-option.selected {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.12);
            box-shadow: var(--glow-primary);
        }
        .mp-option.selected .opt-letter {
            background: rgba(56, 189, 248, 0.25);
            color: var(--primary);
        }
        .mp-option.correct {
            border-color: var(--green);
            background: rgba(52, 211, 153, 0.16);
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.35);
            animation: correctPop 0.4s var(--ease-game);
        }
        .mp-option.correct .opt-letter {
            background: rgba(52, 211, 153, 0.3);
            color: var(--green);
        }
        .mp-option.wrong {
            border-color: var(--red);
            background: rgba(248, 113, 113, 0.14);
            animation: shake 0.45s;
        }
        .mp-option.wrong .opt-letter {
            background: rgba(248, 113, 113, 0.3);
            color: var(--red);
        }
        @keyframes correctPop {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.03);
            }
            100% {
                transform: scale(1);
            }

        function tone(freq, duration, type = 'sine', gainVal = 0.14, delay = 0) {
            if (!isSoundEnabled()) return;
            try {
                const ctx = getAudioCtx();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                const t0 = ctx.currentTime + delay;
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(gainVal, t0 + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t0);
                osc.stop(t0 + duration + 0.03);
            } catch (e) {}
        }

        function spawnRipple(el, e) {
            try {

                const span = document.createElement('span');
                span.className = 'ripple';
                span.style.width = span.style.height = size + 'px';
                span.style.left = (e.clientX - rect.left - size / 2) + 'px';
                span.style.top = (e.clientY - rect.top - size / 2) + 'px';
                const prevPos = getComputedStyle(el).position;
                if (prevPos === 'static') el.style.position = 'relative';
                el.appendChild(span);
                setTimeout(() => span.remove(), 650);
            } catch (err) {}

        // =========================================================

        function prefersReducedMotion() {
            return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        function initParticles() {
            if (prefersReducedMotion()) return;
            const canvas = document.getElementById('bgParticles');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resize() { canvas.width = window.innerWidth;
                canvas.height = window.innerHeight; }
            resize();
            window.addEventListener('resize', resize);
            const count = window.innerWidth < 480 ? 16 : 32;

            function spawn(c) {
                return {
                    x: Math.random() * c.width,
                    y: c.height + Math.random() * 100,
                    r: 1 + Math.random() * 2,
                    vy: 0.25 + Math.random() * 0.5,
                    drift: -0.25 + Math.random() * 0.5,
                    opacity: 0.08 + Math.random() * 0.22
                };
            }
            const particles = Array.from({ length: count }, () => spawn(canvas));
            let raf;

            function tick() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y -= p.vy;
                    p.x += p.drift;
                    if (p.y < -10) { Object.assign(p, spawn(canvas));
                        p.y = canvas.height + 10; }
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(129,140,248,${p.opacity})`;
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                raf = requestAnimationFrame(tick);
            }
            tick();
        }

        // =========================================================
        // CONFETTI
        // =========================================================
        function launchConfetti(particleCount = 140) {
            if (prefersReducedMotion()) return;
            const canvas = document.getElementById('confettiCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const colors = ['#38bdf8', '#818cf8', '#fbbf24', '#34d399', '#f87171', '#f472b6'];
            const particles = Array.from({ length: particleCount }, () => ({
                x: Math.random() * canvas.width,
                y: -20 - Math.random() * canvas.height * 0.4,
                r: 4 + Math.random() * 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vy: 2 + Math.random() * 3,
                vx: -2 + Math.random() * 4,
                rot: Math.random() * 360,
                vr: -8 + Math.random() * 16
            }));
            let frame = 0;
            const maxFrames = 240;

            function tick() {
                frame++;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.02;
                    p.rot += p.vr;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
                    ctx.restore();
                });
                if (frame < maxFrames) requestAnimationFrame(tick);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            tick();
        }

        async function updateSettingsLessons() {
            const subject = document.getElementById('setSubject')?.value || 'science';
            const grade = document.getElementById('setGrade')?.value || '8';
            const select = document.getElementById('setLesson');
            if (!select) return;
            select.innerHTML = '<option value="">Loading...</option>';
            try {
                const resp = await fetch(`data/${subject}.json?t=${Date.now()}`);
                if (!resp.ok) throw new Error('Failed to load JSON');
                const data = await resp.json();
                let lessons = [];
                if (data.grades?.[grade]?.lessons) {
                    lessons = data.grades[grade].lessons;
                } else if (data[subject]?.grades?.[grade]?.lessons) {
                    lessons = data[subject].grades[grade].lessons;
                } else if (data.subjects?.[subject]?.grades?.[grade]?.lessons) {
                    lessons = data.subjects[subject].grades[grade].lessons;
                } else {
                    for (let key in data) {
                        if (data[key]?.grades?.[grade]?.lessons) { lessons = data[key].grades[grade].lessons;
                            break; }
                    }
                }
                if (!lessons || lessons.length === 0) { select.innerHTML =
                        '<option value="">No lessons found</option>'; return; }
                select.innerHTML = lessons.map(l =>
                    `<option value="${l.id}">${escapeHtml(l.title)} (${l.questions?.length || 0} Q)</option>`
                ).join('');
            } catch (e) {
                console.error(e);
                select.innerHTML = '<option value="">Error loading</option>';
            }
        }

        function listenToRoom() {
            if (unsubscribe) unsubscribe();
            stopHeartbeat();
            prevSnapshotStatus = null;
            prevSnapshotQuestionIndex = -1;
            prevSnapshotPlayersJSON = '';
            waitingRoomFullyRendered = false;

            unsubscribe = onSnapshot(doc(db, 'liveMatches', roomId), (snapshot) => {
                if (!snapshot.exists()) { leaveRoom(); return; }
                const data = snapshot.data();
                processRoomSnapshot(data);
            });
            startHeartbeat();
        }

        function processRoomSnapshot(data) {
            const isCriticalChange = data.status !== prevSnapshotStatus ||
                (data.status === 'playing' && data.currentQuestion !== prevSnapshotQuestionIndex);
            if (isCriticalChange) {
                if (snapshotDebounceTimer) { clearTimeout(snapshotDebounceTimer);
                    snapshotDebounceTimer = null; }
                applyRoomSnapshot(data);
                return;
            }
            pendingSnapshotData = data;
            if (snapshotDebounceTimer) return;
            snapshotDebounceTimer = setTimeout(() => {
                snapshotDebounceTimer = null;
                if (pendingSnapshotData) applyRoomSnapshot(pendingSnapshotData);
                pendingSnapshotData = null;
            }, 120);
        }

        function applyRoomSnapshot(data) {
            const players = data.players || {};
            isHost = data.hostId === currentUser.uid;
            if (players[currentUser.uid]) players[currentUser.uid].online = true;

            if (previousPlayers && data.status !== 'waiting') {
                Object.keys(previousPlayers).forEach(uid => {
                    const wasOnline = previousPlayers[uid]?.online;
                    const isOnline = players[uid]?.online;
                    if (wasOnline && !isOnline) {
                        showToast(`🔴 ${previousPlayers[uid].name} left the game!`);
                        playSound('leave');
                    } else if (!wasOnline && isOnline) {
                        showToast(`🟢 ${players[uid].name} rejoined!`, true);
                        playSound('join');
                    }
                });
            }
            if (previousPlayers && data.status === 'waiting') {
                Object.keys(previousPlayers).forEach(uid => {
                    const wasOnline = previousPlayers[uid]?.online;
                    const isOnline = players[uid]?.online;
                    if (!wasOnline && isOnline && uid !== currentUser.uid) {
                        recentlyRejoinedUids.add(uid);
                        setTimeout(() => { recentlyRejoinedUids.delete(uid);
                            refreshWaitingRoomPlayers(); }, 4000);
                    }
                });
            }
            previousPlayers = JSON.parse(JSON.stringify(players));
            lastKnownPlayers = players;
            lastKnownHostId = data.hostId;

            maintainPresence(data, players);

            if (data.status === 'waiting' || (data.status === 'finished' && afterGameChatActive)) {
                startChatListener();
            } else if (data.status !== 'finished') {
                stopChatListener();
            }

            const statusChanged = data.status !== prevSnapshotStatus;
            const questionChanged = data.status === 'playing' && data.currentQuestion !==
                prevSnapshotQuestionIndex;
            const playersChanged = JSON.stringify(players) !== prevSnapshotPlayersJSON;

            const oldStatus = prevSnapshotStatus;
            prevSnapshotStatus = data.status;
            prevSnapshotQuestionIndex = data.currentQuestion;
            prevSnapshotPlayersJSON = JSON.stringify(players);

            if (oldStatus === 'playing' && data.status !== 'playing') {
                if (questionTimer) { clearInterval(questionTimer);
                    questionTimer = null; }
            }

            if (statusChanged || questionChanged) {
                waitingRoomFullyRendered = false;
                currentScreenMode = data.status;
                gameState = data.status;

                switch (data.status) {
                    case 'waiting':
                        renderWaitingRoomFull(data);
                        waitingRoomFullyRendered = true;
                        selectedAnswer = -1;
                        revealActive = false;
                        break;
                    case 'countdown':
                        gameState = 'countdown';
                        playSound('countdown');
                        render(`
                        <div class="mp-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;">
                          <div class="mp-title" style="font-size:2rem;">Game is starting...</div>
                          <div style="font-size:4rem;margin-top:20px;animation:trophyBounce 1s infinite;">⏳</div>
                        </div>
                      `);
                        selectedAnswer = -1;
                        break;
                    case 'playing':
                        currentQuestionIndex = data.currentQuestion || 0;
                        selectedAnswer = -1;
                        revealActive = false;
                        startQuestionTimer(data);
                        renderQuestionFull(data);
                        break;
                    case 'leaderboard':
                        gameState = 'leaderboard';
                        playSound('leaderboard');
                        renderLeaderboard(players, getScores(players));
                        break;
                    case 'finished':
                        gameState = 'finished';
                        renderWinner(players, getScores(players), data);
                        break;
                }
            } else if (data.status === 'waiting' && playersChanged && waitingRoomFullyRendered) {
                requestAnimationFrame(() => {

        function updatePlayerListDOM(players, hostId) {
            const container = document.getElementById('playerListContainer');
            if (!container) return;
            const existingEls = {};
            container.querySelectorAll('[data-player-uid]').forEach(el => { existingEls[el.dataset.playerUid] = el; });
            const currentUids = Object.keys(players);

            Object.keys(existingEls).forEach(uid => {
                if (!currentUids.includes(uid)) {
                    const el = existingEls[uid];
                    if (el.classList.contains('player-leaving')) return;
                    pulseWillChange(el, 'opacity, transform, max-height', 420);
                    el.classList.add('player-leaving');
                    setTimeout(() => { if (el.parentNode) el.remove(); }, 380);
                }
            });

            currentUids.forEach((uid) => {
                const p = players[uid];
                let el = existingEls[uid];
                if (!el) {
                    el = document.createElement('div');
                    el.className = 'mp-player player-entering';
                    el.dataset.playerUid = uid;
                    el.innerHTML = buildSinglePlayerHTML(uid, p, hostId);
                    container.appendChild(el);
                    pulseWillChange(el, 'opacity, transform', 400);
                    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove(
                        'player-entering')));
                } else {
                    el.innerHTML = buildSinglePlayerHTML(uid, p, hostId);
                }
            });
        }

        function getTimerColorClass(frac) {
            if (frac > 0.66) return 'timer-green';
            if (frac > 0.4) return 'timer-yellow';
            if (frac > 0.2) return 'timer-orange';
            return 'timer-red';
        }

        function computeRanks(sorted) {
            const ranks = {};
            sorted.forEach((p, i) => { ranks[p.uid] = i + 1; });
            return ranks;
        }

        function rankChangeIndicatorHTML(uid, rank) {
            const prev = previousRanks[uid];
            if (prev === undefined) return '';
            if (prev === rank) return '<span class="rank-change same"><i class="fa-solid fa-minus"></i></span>';
            if (rank < prev) return `<span class="rank-change up"><i class="fa-solid fa-caret-up"></i> ${prev - rank}</span>`;
            return `<span class="rank-change down"><i class="fa-solid fa-caret-down"></i> ${rank - prev}</span>`;
        }

        function renderLeaderboard(players, scores) {
            const sorted = Object.entries(players).map(([uid, p]) => ({ ...p, uid, score: scores[uid]?.score || 0 }))
                .sort((a, b) => b.score - a.score);
            const currentRanks = computeRanks(sorted);
            const list = sorted.map((p, i) => `
            <div class="mp-leaderboard-item ${i===0?'top-1':i===1?'top-2':i===2?'top-3':''}" style="${!p.online ? 'opacity:0.6;' : ''}animation-delay:${i*0.06}s">
              <div class="mp-rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i===0?'<i class="fa-solid fa-crown"></i>':i+1}</div>
              <div class="mp-player-avatar" style="background:${getAvatarColor(p.uid)}">${(p.name||'?')[0].toUpperCase()}</div>
              <div class="mp-player-info">
                <div class="mp-player-name">
                  ${escapeHtml(p.name)}
                  ${!p.online ? '<span style="font-size:0.6rem;color:#f87171;border:1px solid #f87171;padding:2px 4px;border-radius:4px;margin-left:4px;">Offline</span>' : ''}
                  ${rankChangeIndicatorHTML(p.uid, i + 1)}
                </div>
                <div class="mp-player-status">✅ ${p.correct || 0} / ❌ ${p.wrong || 0}</div>
              </div>
              <div class="mp-player-score" id="score-${p.uid}">${previousScores[p.uid] !== undefined ? previousScores[p.uid] : p.score}</div>
            </div>
          `).join('');
            render(
                `<div class="mp-card"><div class="mp-title" aria-live="polite">📊 Leaderboard</div><div>${list}</div><p style="text-align:center;font-size:0.7rem;color:var(--text2);margin-top:8px;">Next question coming...</p><button class="mp-btn mp-btn-outline" style="margin-top:10px;font-size:0.78rem;padding:10px;" onclick="window.confirmLeaveGame()"><i class="fa-solid fa-door-open"></i>&nbsp; Leave Game</button></div>`
                );
            const finalScores = {};
            sorted.forEach(p => finalScores[p.uid] = p.score);
            animateScoreCounts(finalScores);
            previousRanks = currentRanks;
        }

        function animateScoreCounts(finalScores) {
            const reduced = prefersReducedMotion();
            Object.entries(finalScores).forEach(([uid, finalScore]) => {
                const el = document.getElementById(`score-${uid}`);
                const start = previousScores[uid] !== undefined ? previousScores[uid] : finalScore;
                if (!el) return;
                if (reduced || start === finalScore) { el.textContent = finalScore; return; }
                const duration = 650;
                const t0 = performance.now();

                function step(t) {
                    const p = Math.min(1, (t - t0) / duration);
                    const val = Math.round(start + (finalScore - start) * p);
                    if (el.isConnected) el.textContent = val;
                    if (p < 1 && el.isConnected) requestAnimationFrame(step);
                }
                requestAnimationFrame(step);
            });
            previousScores = { ...previousScores, ...finalScores };
        }

        function animateNumberEl(el, endValue, duration = 700) {
            if (!el) return;
            const reduced = prefersReducedMotion();
            if (reduced) { el.textContent = endValue; return; }
            const t0 = performance.now();

            function step(t) {
                const p = Math.min(1, (t - t0) / duration);
                const val = Math.round(endValue * p);
                if (el.isConnected) el.textContent = val;
                if (p < 1 && el.isConnected) requestAnimationFrame(step);
                else if (el.isConnected) el.textContent = endValue;
            }
            requestAnimationFrame(step);
        }

        // =========================================================
        // RENDER WINNER (with rematch UI)
        // =========================================================
        function renderWinner(players, scores, data) {
            const sorted = Object.entries(players).map(([uid, p]) => ({ ...p, uid, score: scores[uid]?.score || 0 }))
                .sort((a, b) => b.score - a.score);
            const forcedWinnerUid = data && data.forcedWinner;
            const winner = (forcedWinnerUid && players[forcedWinnerUid]) ?
                { ...players[forcedWinnerUid], uid: forcedWinnerUid, score: scores[forcedWinnerUid]?.score || 0 } :
                (sorted[0] || { name: 'No one', score: 0 });
            const me = players[currentUser.uid];
            const myRank = (forcedWinnerUid && currentUser.uid === forcedWinnerUid) ? 1 :
                (sorted.findIndex(p => p.uid === currentUser.uid) + 1);
            const currentRanks = computeRanks(sorted);
            const list = sorted.map((p, i) => `
            <div class="mp-leaderboard-item ${i===0?'top-1':i===1?'top-2':i===2?'top-3':''}" style="${!p.online ? 'opacity:0.6;' : ''}animation-delay:${i*0.06}s">
              <div class="mp-rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i===0?'<i class="fa-solid fa-crown"></i>':i+1}</div>
              <div class="mp-player-avatar" style="background:${getAvatarColor(p.uid)}">${(p.name||'?')[0].toUpperCase()}</div>
              <div class="mp-player-info">
                <div class="mp-player-name">
                  ${escapeHtml(p.name)}
                  ${!p.online ? '<span style="font-size:0.6rem;color:#f87171;border:1px solid #f87171;padding:2px 4px;border-radius:4px;margin-left:4px;">Offline</span>' : ''}
                  ${rankChangeIndicatorHTML(p.uid, i + 1)}
                </div>
              </div>
              <div class="mp-player-score">${p.score}</div>
            </div>
          `).join('');
            previousRanks = currentRanks;
            const myTotal = (me?.correct || 0) + (me?.wrong || 0);
            const accuracy = myTotal > 0 ? Math.round(((me.correct || 0) / myTotal) * 100) : 0;
            const avgTime = me && me.totalTime && myTotal > 0 ? (me.totalTime / myTotal).toFixed(1) + 's' : '—';
            const fastest = me && me.fastestTime !== undefined && me.fastestTime !== null ? me.fastestTime.toFixed(1) +
                's' : '—';
            const longestStreak = me?.longestStreak || 0;

            // --- REMATCH STATE ---
            const rematch = data.rematch || { status: 'none', requestedBy: null, requestedByName: null };
            const rematchStatus = rematch.status || 'none';
            const requesterUid = rematch.requestedBy;
            const requesterName = rematch.requestedByName || '';

            // Determine what to show
            let rematchSectionHTML = '';

            // If rematch status is 'accepted', show "Starting new game..." and return early (or let the snapshot transition handle it)
            if (rematchStatus === 'accepted') {
                rematchSectionHTML = `
              <div style="text-align:center;padding:12px 0;color:var(--green);">
                <i class="fa-solid fa-spinner fa-spin"></i> Starting new game...
              </div>
            `;
            } else if (rematchStatus === 'pending') {
                if (isHost) {
                    // Host sees Accept / Decline buttons
                    rematchSectionHTML = `
                <div style="background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.25);border-radius:12px;padding:14px;margin:12px 0;text-align:center;">
                  <p style="font-weight:600;color:var(--yellow);"><i class="fa-solid fa-rotate"></i> ${escapeHtml(requesterName)} requested a rematch</p>
                  <div style="display:flex;gap:8px;margin-top:12px;">
                    <button class="mp-btn mp-btn-success" style="flex:1;" onclick="window.acceptRematch()">✅ Accept</button>
                    <button class="mp-btn mp-btn-danger" style="flex:1;" onclick="window.declineRematch()">❌ Decline</button>
                  </div>
                </div>
              `;
                } else {
                    // Other players see "Waiting for host response..."
                    rematchSectionHTML = `
                <div style="text-align:center;padding:12px 0;color:var(--text2);">
                  <i class="fa-solid fa-hourglass-half"></i> Waiting for host response...
                </div>
              `;
                }
            } else {
                // 'none', 'declined', 'cancelled' — show request button (if not already pending)
                // Only show if the room still has at least 2 players and status is finished
                const onlineCount = Object.values(players).filter(p => p.online).length;
                if (onlineCount >= 2) {
                    rematchSectionHTML = `
                <div style="text-align:center;margin:12px 0;">
                  <button class="mp-btn mp-btn-primary pulse-cta" onclick="window.requestRematch()" id="requestRematchBtn">
                    <i class="fa-solid fa-rotate"></i> Request Rematch
                  </button>
                </div>
              `;
                } else {

            // Host's existing rematch buttons — keep them, but hide if there's a pending request

            render(`
            <div class="mp-card">

                  <span class="trophy-sparkle s2">✨</span>

                ${myRank === 1 ? '<div class="champion-badge"><i class="fa-solid fa-crown"></i> You are the Champion!</div>' : ''}
                ${forcedWinnerUid ? '<p style="font-size:0.72rem;color:var(--text2);margin-top:8px;"><i class="fa-solid fa-circle-info"></i> Match ended early — other players left</p>' : ''}
              </div>

                <div class="stat-box"><div class="stat-val" id="statAccuracy">0%</div><div class="stat-lbl">Accuracy</div></div>
                <div class="stat-box"><div class="stat-val">${me?.correct || 0}/${me?.wrong || 0}</div><div class="stat-lbl">Correct/Wrong</div></div>
                <div class="stat-box"><div class="stat-val">${avgTime}</div><div class="stat-lbl">Avg Time</div></div>
                <div class="stat-box"><div class="stat-val">${fastest}</div><div class="stat-lbl">Fastest</div></div>
                <div class="stat-box"><div class="stat-val" id="statStreak">0</div><div class="stat-lbl">Best Streak</div></div>

            <div class="mp-card chat-card" id="afterGameChatCard">
              <div class="mp-title" style="font-size:1rem;">💬 Post-Game Chat <span class="chat-close-note">(closes in 2 min)</span></div>
              <div class="chat-messages" id="chatMessages"></div>
              <div class="reaction-row">
                <button class="icon-btn reaction-btn" onclick="window.sendReaction('🔥')">🔥</button>
                <button class="icon-btn reaction-btn" onclick="window.sendReaction('😂')">😂</button>
                <button class="icon-btn reaction-btn" onclick="window.sendReaction('👍')">👍</button>
                <button class="icon-btn reaction-btn" onclick="window.sendReaction('❤️')">❤️</button>
                <button class="icon-btn reaction-btn" onclick="window.sendReaction('🎉')">🎉</button>
              </div>
              <div class="chat-input-row">
                <input type="text" id="chatInput" class="mp-input chat-input" placeholder="Type a message..." maxlength="150" onkeydown="window.handleChatKeydown(event)">

            launchConfetti();
            playSound('victory');
            animateNumberEl(document.getElementById('statStreak'), longestStreak, 600);
            const accEl = document.getElementById('statAccuracy');
            if (accEl) {
                if (prefersReducedMotion()) { accEl.textContent = accuracy + '%'; } else {
                    const t0 = performance.now();
                    const dur = 700;
                    (function stepAcc(t) {
                        const p = Math.min(1, (t - t0) / dur);
                        if (accEl.isConnected) accEl.textContent = Math.round(accuracy * p) + '%';
                        if (p < 1 && accEl.isConnected) requestAnimationFrame(stepAcc);
                    })(t0);
                }
            }
            if (me) {
                achievementQueue = achievementQueue.concat(computeAchievements(me));
                queueRankAchievements(myRank);
                showNextAchievement();
            }
            if (isHost && data && !data.historySaved) saveMatchHistory(data);

            startAfterGameChat();

            // If rematch is 'accepted', we auto-transition to the new game (handled by snapshot)
            // If rematch is 'pending', the host sees the buttons; others see waiting.
            // If rematch is 'none/declined/cancelled', show the request button.
        }

        // =========================================================
        // AFTER-GAME CHAT
        // =========================================================
        function startAfterGameChat() {
            if (afterGameChatActive) return;
            afterGameChatActive = true;
            startChatListener();
            renderChatMessages();
            if (afterGameChatTimer) clearTimeout(afterGameChatTimer);
            afterGameChatTimer = setTimeout(() => { closeAfterGameChat(); }, 120000);
        }

        function closeAfterGameChat() {
            if (afterGameChatTimer) { clearTimeout(afterGameChatTimer);
                afterGameChatTimer = null; }
            if (!afterGameChatActive) return;
            afterGameChatActive = false;
            stopChatListener();
            const card = document.getElementById('afterGameChatCard');
            if (card && card.parentNode) card.remove();
        }

        // =========================================================
        // TOGGLE READY
        // =========================================================
        async function toggleReady() {
            if (!roomId) return;
            const roomRef = doc(db, 'liveMatches', roomId);
            const snap = await getDoc(roomRef);
            const currentReady = snap.data().players[currentUser.uid]?.ready || false;
            await updateDoc(roomRef, { [`players.${currentUser.uid}.ready`]: !currentReady });
            if (!currentReady) playSound('ready');
        }

        // =========================================================
        // START GAME
        // =========================================================
        async function startGame() {
            if (!isHost || !roomId) return;
            await addSystemChatMessage(roomId, 'Host started the game! 🚀');
            await updateDoc(doc(db, 'liveMatches', roomId), { status: 'countdown' });
            setTimeout(async () => {

                    status: 'playing',

                });

        }

        // =========================================================
        // SELECT ANSWER
        // =========================================================
        async function selectAnswer(index) {
            if (selectedAnswer >= 0 || !roomId || answeringInFlight) return;
            answeringInFlight = true;
            selectedAnswer = index;
            answeredQuestionIndices.add(currentQuestionIndex);
            vibrate(8);
            try {
                await updateDoc(doc(db, 'liveMatches', roomId), {
                    [`players.${currentUser.uid}.answered`]: true,
                    [`players.${currentUser.uid}.answer`]: index,
                    [`players.${currentUser.uid}.answerTime`]: Date.now()
                });
                const data = (await getDoc(doc(db, 'liveMatches', roomId))).data();
                if (data && data.status === 'playing') {
                    updateQuestionOptionsDOM(data);
                }
            } catch (e) {
                selectedAnswer = -1;
            } finally {
                answeringInFlight = false;
            }
        }
        window.selectAnswer = selectAnswer;

        // =========================================================
        // LEAVE ROOM
        // =========================================================
        async function leaveRoom() {
            closeAfterGameChat();
            // If there's a pending rematch request and this player is the requester, cancel it
            if (roomId && currentUser && rematchPending && rematchRequestedBy === currentUser.uid) {
                try {
                    await cancelRematchRequest('cancelled', 'Rematch request cancelled — requester left.');
                } catch (e) {}
            }
            stopHeartbeat();
            stopChatListener();
            if (roomId && currentUser) {
                try {
                    const roomRef = doc(db, 'liveMatches', roomId);
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        const players = data.players || {};
                        const otherOnline = Object.keys(players).filter(uid => uid !== currentUser.uid && players[uid]
                            ?.online);
                        if (data.status === 'waiting') {
                            await addSystemChatMessage(roomId,
                                `${players[currentUser.uid]?.name || playerName || 'A player'} left the game`);
                        }
                        if (otherOnline.length === 0) {
                            await deleteRoomCompletely(roomId);
                        } else if (data.status !== 'waiting' && data.status !== 'finished' && otherOnline.length === 1) {
                            await updateDoc(roomRef, {
                                status: 'finished',
                                forcedWinner: otherOnline[0],
                                hostId: otherOnline[0],
                                [`players.${currentUser.uid}.online`]: false
                            });
                        } else if (isHost) {
                            // If host leaves and there's a pending rematch, cancel it
                            const rematch = data.rematch || {};
                            if (rematch.status === 'pending') {
                                await updateDoc(roomRef, {
                                    'rematch.status': 'cancelled',
                                    'rematch.requestedBy': null,
                                    'rematch.requestedByName': null,
                                    'rematch.timestamp': null
                                });
                                await addSystemChatMessage(roomId, 'Rematch request cancelled — host left.');
                            }
                            await updateDoc(roomRef, {
                                hostId: otherOnline.sort()[0],
                                [`players.${currentUser.uid}.online`]: false
                            });
                        } else {
                            await updateDoc(roomRef, { [`players.${currentUser.uid}.online`]: false });
                        }
                    }
                } catch (e) {}
            }
            if (unsubscribe) unsubscribe();
            if (questionTimer) { clearInterval(questionTimer);
                questionTimer = null; }
            if (snapshotDebounceTimer) { clearTimeout(snapshotDebounceTimer);
                snapshotDebounceTimer = null; }
            pendingSnapshotData = null;
            clearActiveRoom();
            roomId = null;
            roomCode = null;
            isHost = false;
            selectedAnswer = -1;
            previousPlayers = null;
            revealActive = false;
            previousScores = {};
            previousRanks = {};
            qrRendered = false;
            achievementQueue = [];
            recentlyRejoinedUids = new Set();
            answeredQuestionIndices = new Set();
            rematchPending = false;
            rematchRequestedBy = null;
            rematchRequestedByName = '';
            waitingRoomFullyRendered = false;
            prevSnapshotStatus = null;
            prevSnapshotQuestionIndex = -1;
            prevSnapshotPlayersJSON = '';
            currentScreenMode = 'lobby';
            renderLobby();
        }
        window.leaveRoom = leaveRoom;

            rematchPending = false;

        // =========================================================
        // NEW: REMATCH REQUEST SYSTEM
        // =========================================================

        /**
         * Request a rematch (called by any player)
         * - Only works when status === 'finished'
         * - Only one pending request at a time
         * - Host cannot request (they already have rematch buttons)
         *   Actually, the user said "Every player" so host can also request,
         *   but we'll let the host use their existing buttons instead.
         *   Let's allow host to request too, but they'll see their own request
         *   with Accept/Decline? No — host shouldn't request from themselves.
         *   Let's keep it simple: host doesn't need to request, they can rematch directly.
         *   But the user said "Every player" — so host can also request.
         *   However, if host requests, they'd see "Waiting for host response..." which is weird.
         *   Let's disable request button for host.
         */
        async function requestRematch() {
            if (!roomId || !currentUser) return;
            if (isHost) {
                showToast('You are the host — use the Rematch or Quick Rematch buttons.');
                return;
            }
            if (rematchPending) {
                showToast('A rematch request is already pending.');
                return;
            }
            const roomRef = doc(db, 'liveMatches', roomId);
            const snap = await getDoc(roomRef);
            if (!snap.exists()) return;
            const data = snap.data();
            if (data.status !== 'finished') {
                showToast('The game must be finished to request a rematch.');
                return;
            }
            const rematch = data.rematch || {};
            if (rematch.status === 'pending') {
                showToast('A rematch request is already pending.');
                return;
            }
            const players = data.players || {};
            const onlineCount = Object.values(players).filter(p => p.online).length;
            if (onlineCount < 2) {
                showToast('Need at least 2 players for a rematch.');
                return;
            }
            // Set the rematch request
            try {
                await updateDoc(roomRef, {
                    'rematch.status': 'pending',
                    'rematch.requestedBy': currentUser.uid,
                    'rematch.requestedByName': playerName || 'Player',
                    'rematch.timestamp': serverTimestamp()
                });
                rematchPending = true;
                rematchRequestedBy = currentUser.uid;
                rematchRequestedByName = playerName || 'Player';
                await addSystemChatMessage(roomId, `🔄 ${playerName || 'A player'} requested a rematch.`);
                showToast('✅ Rematch request sent!');
            } catch (e) {
                console.error('Request rematch error:', e);
                showToast('❌ Failed to request rematch.');
            }
        }
        window.requestRematch = requestRematch;

        /**
         * Accept a rematch request (host only)
         * - Resets everything and starts a new match
         */
        async function acceptRematch() {
            if (!isHost || !roomId) return;
            const roomRef = doc(db, 'liveMatches', roomId);
            const snap = await getDoc(roomRef);
            if (!snap.exists()) return;
            const data = snap.data();
            const rematch = data.rematch || {};
            if (rematch.status !== 'pending') {
                showToast('No pending rematch request.');
                return;
            }
            const requesterUid = rematch.requestedBy;
            const requesterName = rematch.requestedByName || 'Player';

            // Reset everything
            const resetPlayers = Object.fromEntries(
                Object.entries(data.players || {}).map(([uid, p]) => [uid, {
                    ...p,
                    score: 0,
                    correct: 0,
                    wrong: 0,
                    answered: false,
                    ready: false,
                    streak: 0,
                    longestStreak: 0,
                    totalTime: 0,
                    fastestTime: null
                }])
            );
            try {
                await updateDoc(roomRef, {
                    status: 'countdown',
                    currentQuestion: -1,
                    historySaved: false,
                    forcedWinner: null,
                    players: resetPlayers,
                    'rematch.status': 'accepted',
                    'rematch.requestedBy': null,
                    'rematch.requestedByName': null,
                    'rematch.timestamp': null
                });
                rematchPending = false;
                rematchRequestedBy = null;
                rematchRequestedByName = '';
                await addSystemChatMessage(roomId, `✅ Host accepted the rematch. 🎮 New game starting...`);
                playSound('countdown');
                setTimeout(async () => {
                    await updateDoc(roomRef, {
                        status: 'playing',
                        currentQuestion: 0,
                        questionStartTime: Date.now()
                    });
                }, 3000);
            } catch (e) {
                console.error('Accept rematch error:', e);
                showToast('❌ Failed to accept rematch.');
            }
        }
        window.acceptRematch = acceptRematch;

        /**
         * Decline a rematch request (host only)
         */
        async function declineRematch() {
            if (!isHost || !roomId) return;
            const roomRef = doc(db, 'liveMatches', roomId);
            const snap = await getDoc(roomRef);
            if (!snap.exists()) return;
            const data = snap.data();

            if (rematch.status !== 'pending') {

        /**
         * Cancel a rematch request (internal)

        async function cancelRematchRequest(status = 'cancelled', chatMsg = 'Rematch request cancelled.') {
            if (!roomId) return;
            const roomRef = doc(db, 'liveMatches', roomId);
            try {
                await updateDoc(roomRef, {

                });
