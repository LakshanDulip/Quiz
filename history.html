<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Hub - Match History</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/multiplayer.css">
  <style>
    .history-search { display: flex; gap: 8px; margin-bottom: 16px; }
    .history-search input { flex: 1; }
    .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .history-item:hover { border-color: var(--primary); }
    .history-detail { font-size: 0.8rem; color: var(--text2); margin-top: 4px; }
  </style>
</head>
<body>
  <a href="index.html" class="home-link" style="position:fixed;top:12px;left:12px;z-index:100;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:0.8rem;font-weight:600;">← Home</a>
  
  <div class="mp-container" id="app">
    <div class="mp-card">
      <div class="mp-title">📊 Match History</div>
      <div class="history-search">
        <input type="text" class="mp-input" id="searchInput" placeholder="Search Room Code or Player..." oninput="loadHistory()">
      </div>
      <div id="historyList"><p style="text-align:center;color:var(--text2);">Loading...</p></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhfgx0t-E6wrz6zEFIU_tpKTIbELp00ss",
      authDomain: "quiz-hub-225eb.firebaseapp.com",
      projectId: "quiz-hub-225eb",
      storageBucket: "quiz-hub-225eb.firebasestorage.app",
      messagingSenderId: "387012755680",
      appId: "1:387012755680:web:36108ab447a8a2f2ab9085"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    window.loadHistory = async function() {
      const search = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
      const list = document.getElementById('historyList');
      list.innerHTML = '<p style="text-align:center;color:var(--text2);">Loading...</p>';

      try {
        const q = query(collection(db, 'matchHistory'), orderBy('date', 'desc'), limit(20));
        const snapshot = await getDocs(q);
        
        let matches = [];
        snapshot.forEach(doc => matches.push({ id: doc.id, ...doc.data() }));
        
        if (search) {
          matches = matches.filter(m => 
            (m.roomCode || '').toLowerCase().includes(search) ||
            (m.players || []).some(p => (p.name || '').toLowerCase().includes(search))
          );
        }

        if (matches.length === 0) {
          list.innerHTML = '<p style="text-align:center;color:var(--text2);">No matches found</p>';
          return;
        }

        list.innerHTML = matches.map(m => {
          const winner = m.players?.sort((a,b) => (b.score||0) - (a.score||0))[0];
          return `
            <div class="history-item" onclick="viewMatch('${m.id}')">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-weight:700;">🏆 ${escapeHtml(winner?.name || 'N/A')}</span>
                <span style="font-size:0.75rem;color:var(--primary);">${m.roomCode}</span>
              </div>
              <div class="history-detail">
                ${new Date(m.date?.seconds*1000).toLocaleDateString()} • ${m.players?.length || 0} players • ${m.totalQuestions || 0} questions
              </div>
            </div>
          `;
        }).join('');
      } catch(e) {
        list.innerHTML = '<p style="text-align:center;color:var(--red);">Error loading history</p>';
      }
    };

    window.viewMatch = function(matchId) {
      alert('Match details: ' + matchId);
    };

    loadHistory();
  </script>
</body>
</html>
